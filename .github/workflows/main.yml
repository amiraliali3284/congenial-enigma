name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO-Workspace
  DAO_LOGS: D:\DAO-Logs
  DAO_TOOLS: D:\DAO-Tools
  DAO_BACKUP: D:\DAO-Backup
  DAO_RESTORE: D:\DAO-Restore

  DAO_BACKUP_NAME: dao-windows-backup
  DAO_LOGS_NAME: dao-windows-logs

  DAO_RUNTIME_SECONDS: 13500

jobs:
  desktop:

    name: DAO Windows Desktop

    runs-on: windows-2025

    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      # ==========================================================
      # 2. INITIALIZE
      # ==========================================================

      - name: Initialize DAO environment
        run: |
          $ErrorActionPreference = "Stop"

          $directories = @(
            $env:DAO_ROOT,
            $env:DAO_LOGS,
            $env:DAO_TOOLS,
            $env:DAO_BACKUP,
            $env:DAO_RESTORE
          )

          foreach ($directory in $directories) {
            New-Item `
              -ItemType Directory `
              -Path $directory `
              -Force |
              Out-Null
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Runner      : $env:RUNNER_NAME"
          Write-Host "OS          : $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host ""
          Write-Host "Workspace   : $env:DAO_ROOT"
          Write-Host "Logs        : $env:DAO_LOGS"
          Write-Host "Tools       : $env:DAO_TOOLS"
          Write-Host "Backup      : $env:DAO_BACKUP"
          Write-Host "Restore     : $env:DAO_RESTORE"

      # ==========================================================
      # 3. CREATE LOG
      # ==========================================================

      - name: Initialize log
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "workflow.log"

          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss K"

          @"
          DAO WINDOWS DESKTOP
          ===================

          Started:
          $timestamp

          Runner:
          $env:RUNNER_NAME

          OS:
          $env:RUNNER_OS

          Workspace:
          $env:DAO_ROOT

          Logs:
          $env:DAO_LOGS

          Backup:
          $env:DAO_BACKUP

          Restore:
          $env:DAO_RESTORE

          "@ |
          Set-Content `
            -LiteralPath $log `
            -Encoding UTF8

      # ==========================================================
      # 4. CHECK SECRETS
      # ==========================================================

      - name: Validate secrets
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "VNC_PASSWORD Secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD Secret is missing."
          }

          Write-Host "[OK] VNC_PASSWORD is configured."
          Write-Host "[OK] ANYDESK_PASSWORD is configured."

      # ==========================================================
      # 5. RUNNER INFORMATION
      # ==========================================================

      - name: Collect Windows information
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "system-info.txt"

          $lines = @()

          $lines += "DAO SYSTEM INFORMATION"
          $lines += "======================="
          $lines += ""

          $lines += "Computer:"
          $lines += $env:COMPUTERNAME
          $lines += ""

          $lines += "User:"
          $lines += $env:USERNAME
          $lines += ""

          $lines += "PowerShell:"
          $lines += $PSVersionTable.PSVersion.ToString()
          $lines += ""

          try {
            $os = Get-CimInstance Win32_OperatingSystem

            $lines += "Windows:"
            $lines += $os.Caption
            $lines += ""

            $lines += "Version:"
            $lines += $os.Version
            $lines += ""
          }
          catch {
            $lines += "Windows information unavailable."
          }

          $lines |
            Set-Content `
              -LiteralPath $log `
              -Encoding UTF8

          Get-Content -LiteralPath $log

      # ==========================================================
      # 6. TOOLING
      # ==========================================================

      - name: Check available tooling
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "tooling.txt"

          $output = New-Object System.Collections.Generic.List[string]

          $output.Add("DAO TOOLING")
          $output.Add("===========")
          $output.Add("")

          foreach ($command in @(
            "git",
            "gh",
            "python",
            "py",
            "winget",
            "choco"
          )) {

            try {
              $cmd = Get-Command $command -ErrorAction Stop

              $output.Add(
                "[OK] $command -> $($cmd.Source)"
              )
            }
            catch {
              $output.Add(
                "[INFO] $command unavailable"
              )
            }
          }

          $output |
            Set-Content `
              -LiteralPath $log `
              -Encoding UTF8

          Get-Content -LiteralPath $log

      # ==========================================================
      # 7. FIND PREVIOUS BACKUP
      # ==========================================================

      - name: Find latest DAO backup
        id: find_backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Continue"

          $found = $false
          $runId = ""

          Write-Host ""
          Write-Host "Searching previous successful runs..."

          try {

            $json = gh run list `
              --repo $env:REPOSITORY `
              --workflow main.yml `
              --status completed `
              --limit 50 `
              --json databaseId,status,conclusion,createdAt

            if (-not [string]::IsNullOrWhiteSpace($json)) {

              $runs = @(
                $json |
                ConvertFrom-Json
              )

              foreach ($run in $runs) {

                if (
                  [string]$run.databaseId `
                    -eq `
                  [string]$env:CURRENT_RUN_ID
                ) {
                  continue
                }

                if ($run.conclusion -ne "success") {
                  continue
                }

                try {

                  $apiPath =
                    "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                  $artifactJson = gh api `
                    -H "Accept: application/vnd.github+json" `
                    $apiPath

                  if ([string]::IsNullOrWhiteSpace($artifactJson)) {
                    continue
                  }

                  $response =
                    $artifactJson |
                    ConvertFrom-Json

                  $candidate = @(
                    $response.artifacts |
                    Where-Object {
                      $_.name -eq $env:DAO_BACKUP_NAME -and
                      $_.expired -eq $false
                    }
                  ) |
                  Select-Object -First 1

                  if ($null -ne $candidate) {

                    $found = $true
                    $runId = [string]$run.databaseId

                    Write-Host "[OK] Backup found."
                    Write-Host "Run ID: $runId"

                    break
                  }
                }
                catch {
                  Write-Warning `
                    "Could not inspect run $($run.databaseId)."
                }
              }
            }
          }
          catch {
            Write-Warning `
              "Backup discovery failed: $($_.Exception.Message)"
          }

          if (-not $found) {
            Write-Host "[INFO] No previous backup found."
          }

          "found=$($found.ToString().ToLowerInvariant())" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "run_id=$runId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      # ==========================================================
      # 8. DOWNLOAD PREVIOUS BACKUP
      # ==========================================================

      - name: Download previous backup
        if: steps.find_backup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ steps.find_backup.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath $env:DAO_RESTORE) {

            Remove-Item `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force |
            Out-Null

          gh run download `
            $env:BACKUP_RUN_ID `
            --repo $env:REPOSITORY `
            --name $env:DAO_BACKUP_NAME `
            --dir $env:DAO_RESTORE

          if ($LASTEXITCODE -ne 0) {
            throw "Backup download failed."
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          Write-Host "Downloaded files: $($files.Count)"

          if ($files.Count -eq 0) {
            throw "Backup artifact contains no files."
          }

      # ==========================================================
      # 9. RESTORE DATA
      # ==========================================================

      - name: Restore DAO data
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "restore.log"

          Add-Content `
            -LiteralPath $log `
            -Value "DAO RESTORE" `
            -Encoding UTF8

          Add-Content `
            -LiteralPath $log `
            -Value "============" `
            -Encoding UTF8

          if (-not (Test-Path -LiteralPath $env:DAO_RESTORE)) {

            Add-Content `
              -LiteralPath $log `
              -Value "No restore directory found." `
              -Encoding UTF8

            Write-Host "[INFO] No previous backup to restore."
            exit 0
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {

            Add-Content `
              -LiteralPath $log `
              -Value "No backup files found." `
              -Encoding UTF8

            Write-Host "[INFO] Backup is empty."
            exit 0
          }

          foreach ($file in $files) {

            $relative = $file.FullName.Substring(
              $env:DAO_RESTORE.Length
            ).TrimStart(
              "\"
            )

            $destination = Join-Path `
              $env:DAO_ROOT `
              $relative

            $parent = Split-Path `
              -Parent `
              $destination

            if ($parent) {

              New-Item `
                -ItemType Directory `
                -Path $parent `
                -Force |
                Out-Null
            }

            try {

              Copy-Item `
                -LiteralPath $file.FullName `
                -Destination $destination `
                -Force `
                -ErrorAction Stop

              Add-Content `
                -LiteralPath $log `
                -Value "[OK] $relative" `
                -Encoding UTF8
            }
            catch {

              Add-Content `
                -LiteralPath $log `
                -Value "[WARN] $relative : $($_.Exception.Message)" `
                -Encoding UTF8
            }
          }

          Write-Host "[OK] Restore phase completed."

      # ==========================================================
      # 10. CREATE WORKSPACE STRUCTURE
      # ==========================================================

      - name: Prepare DAO workspace
        run: |
          $ErrorActionPreference = "Stop"

          $directories = @(
            (Join-Path $env:DAO_ROOT "Applications"),
            (Join-Path $env:DAO_ROOT "Data"),
            (Join-Path $env:DAO_ROOT "Config"),
            (Join-Path $env:DAO_ROOT "Projects")
          )

          foreach ($directory in $directories) {

            New-Item `
              -ItemType Directory `
              -Path $directory `
              -Force |
              Out-Null
          }

          Write-Host "[OK] Workspace ready."

      # ==========================================================
      # 11. OPTIONAL APPLICATIONS
      # ==========================================================

      - name: Install basic applications
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "applications.log"

          function Log {
            param([string]$Text)

            Write-Host $Text

            Add-Content `
              -LiteralPath $log `
              -Value $Text `
              -Encoding UTF8
          }

          Log "DAO APPLICATION SETUP"
          Log "====================="

          $winget = Get-Command `
            winget.exe `
            -ErrorAction SilentlyContinue

          if (-not $winget) {

            Log "[INFO] winget unavailable."
            exit 0
          }

          $packages = @(
            @{
              Id = "FileZilla.FileZilla"
              Name = "FileZilla"
            },
            @{
              Id = "Geany.Geany"
              Name = "Geany"
            }
          )

          foreach ($package in $packages) {

            Log "Checking $($package.Name)..."

            try {

              & winget list `
                --id $package.Id `
                --exact `
                --accept-source-agreements `
                --disable-interactivity `
                2>$null

              if ($LASTEXITCODE -eq 0) {

                Log "[OK] $($package.Name) already installed."
                continue
              }
            }
            catch {
            }

            try {

              & winget install `
                --id $package.Id `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -eq 0) {
                Log "[OK] $($package.Name) installed."
              }
              else {
                Log "[WARN] $($package.Name) installation returned $LASTEXITCODE."
              }
            }
            catch {

              Log `
                "[WARN] $($package.Name): $($_.Exception.Message)"
            }
          }

      # ==========================================================
      # 12. WRITE CONNECTION / STATUS INFORMATION
      # ==========================================================

      - name: Create DAO status dashboard
        run: |
          $ErrorActionPreference = "Continue"

          $info = Join-Path `
            $env:DAO_LOGS `
            "connection-info.txt"

          $dashboard = @"
          ==============================================
                  DAO WINDOWS DESKTOP
          ==============================================

          Workspace:
          $env:DAO_ROOT

          Runner:
          $env:RUNNER_NAME

          OS:
          $env:RUNNER_OS

          ==============================================

          This workflow does not expose a public
          VNC / AnyDesk / Cloudflare remote endpoint.

          ==============================================

          Backup:
          $env:DAO_BACKUP

          Restore:
          $env:DAO_RESTORE

          Runtime:
          03:45:00

          ==============================================
          Passwords:
          Not displayed.
          Not written to logs.

          ==============================================
          "@

          Set-Content `
            -LiteralPath $info `
            -Value $dashboard `
            -Encoding UTF8

          Get-Content -LiteralPath $info

      # ==========================================================
      # 13. KEEP WORKSPACE ALIVE
      # ==========================================================

      - name: Keep DAO environment alive
        id: keepalive
        run: |
          $ErrorActionPreference = "Continue"

          $maximumSeconds =
            [int]$env:DAO_RUNTIME_SECONDS

          $started = Get-Date

          $deadline =
            $started.AddSeconds(
              $maximumSeconds
            )

          $log = Join-Path `
            $env:DAO_LOGS `
            "runtime.log"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          DAO ENVIRONMENT ACTIVE"
          Write-Host "=============================================="
          Write-Host ""

          while ((Get-Date) -lt $deadline) {

            $now = Get-Date

            $elapsed = [int](
              ($now - $started).TotalSeconds
            )

            $remaining =
              $maximumSeconds - $elapsed

            if ($remaining -lt 0) {
              $remaining = 0
            }

            $elapsedTime =
              [TimeSpan]::FromSeconds(
                $elapsed
              )

            $remainingTime =
              [TimeSpan]::FromSeconds(
                $remaining
              )

            $message =
              "[{0}] Runtime={1} Remaining={2}" -f `
              $now.ToString("yyyy-MM-dd HH:mm:ss"), `
              $elapsedTime.ToString("hh\:mm\:ss"), `
              $remainingTime.ToString("hh\:mm\:ss")

            Write-Host $message

            Add-Content `
              -LiteralPath $log `
              -Value $message `
              -Encoding UTF8

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "Runtime completed."

      # ==========================================================
      # 14. CREATE BACKUP
      # ==========================================================

      - name: Create DAO backup
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $log = Join-Path `
            $env:DAO_LOGS `
            "backup.log"

          if (Test-Path -LiteralPath $env:DAO_BACKUP) {

            Remove-Item `
              -LiteralPath $env:DAO_BACKUP `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_BACKUP `
            -Force |
            Out-Null

          Add-Content `
            -LiteralPath $log `
            -Value "DAO BACKUP" `
            -Encoding UTF8

          Add-Content `
            -LiteralPath $log `
            -Value "==========" `
            -Encoding UTF8

          if (-not (Test-Path -LiteralPath $env:DAO_ROOT)) {

            Add-Content `
              -LiteralPath $log `
              -Value "Workspace does not exist." `
              -Encoding UTF8

            exit 0
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          foreach ($file in $files) {

            try {

              $relative =
                $file.FullName.Substring(
                  $env:DAO_ROOT.Length
                ).TrimStart("\", "/")

              $destination =
                Join-Path `
                  $env:DAO_BACKUP `
                  $relative

              $parent =
                Split-Path `
                  -Parent `
                  $destination

              if ($parent) {

                New-Item `
                  -ItemType Directory `
                  -Path $parent `
                  -Force |
                  Out-Null
              }

              Copy-Item `
                -LiteralPath $file.FullName `
                -Destination $destination `
                -Force `
                -ErrorAction Stop

              Add-Content `
                -LiteralPath $log `
                -Value "[OK] $relative" `
                -Encoding UTF8
            }
            catch {

              Add-Content `
                -LiteralPath $log `
                -Value "[WARN] $($file.FullName): $($_.Exception.Message)" `
                -Encoding UTF8
            }
          }

          Write-Host "[OK] Backup created."

      # ==========================================================
      # 15. UPLOAD BACKUP
      # ==========================================================

      - name: Upload DAO backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # ==========================================================
      # 16. PREPARE SUMMARY
      # ==========================================================

      - name: Prepare DAO logs
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $summaryFile = Join-Path `
            $env:DAO_LOGS `
            "workflow-summary.txt"

          $summary = @"
          DAO WINDOWS DESKTOP
          ===================

          Repository:
          $env:GITHUB_REPOSITORY

          Run ID:
          $env:GITHUB_RUN_ID

          Workflow:
          $env:GITHUB_WORKFLOW

          Runner:
          $env:RUNNER_NAME

          Workspace:
          $env:DAO_ROOT

          Logs:
          $env:DAO_LOGS

          Backup:
          $env:DAO_BACKUP

          Runtime:
          03:45:00

          Hard workflow limit:
          04:00:00

          Generated:
          $(Get-Date -Format "yyyy-MM-dd HH:mm:ss K")

          Remote access:
          Disabled in this safe single-file workflow.

          Secrets:
          VNC_PASSWORD and ANYDESK_PASSWORD are not
          written to files or displayed.

          "@

          Set-Content `
            -LiteralPath $summaryFile `
            -Value $summary `
            -Encoding UTF8

          Write-Host ""
          Write-Host "DAO log files:"
          Write-Host ""

          Get-ChildItem `
            -LiteralPath $env:DAO_LOGS `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ==========================================================
      # 17. UPLOAD LOGS
      # ==========================================================

      - name: Upload DAO logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-Logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ==========================================================
      # 18. FINAL DASHBOARD
      # ==========================================================

      - name: Final DAO dashboard
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Runner:"
          Write-Host $env:RUNNER_NAME
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host $env:DAO_ROOT
          Write-Host ""

          Write-Host "Backup artifact:"
          Write-Host "dao-windows-backup"
          Write-Host ""

          Write-Host "Logs artifact:"
          Write-Host "dao-windows-logs"
          Write-Host ""

          Write-Host "Runtime:"
          Write-Host "03:45:00"
          Write-Host ""

          Write-Host "Hard workflow timeout:"
          Write-Host "04:00:00"
          Write-Host ""

          Write-Host "Remote public endpoint:"
          Write-Host "Not enabled."
          Write-Host ""

          Write-Host "Secrets:"
          Write-Host "Not displayed."
          Write-Host ""

          Write-Host "=============================================="
          Write-Host "             DAO DESKTOP END"
          Write-Host "=============================================="
