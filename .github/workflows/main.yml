name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO-Workspace
  DAO_BACKUP: D:\DAO-Backup
  DAO_RESTORE: D:\DAO-Restore

  BACKUP_NAME: dao-windows-backup

  # 4 hours total
  TOTAL_SECONDS: 14400

  # Start backup 10 minutes before shutdown
  BACKUP_SECONDS: 600

jobs:

  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1


      # ==========================================================
      # 2. PREPARE DIRECTORIES
      # ==========================================================

      - name: Prepare workspace
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($dir in @(
            $env:DAO_ROOT,
            $env:DAO_BACKUP,
            $env:DAO_RESTORE
          )) {
            New-Item `
              -ItemType Directory `
              -Path $dir `
              -Force | Out-Null
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host " DAO WINDOWS DESKTOP"
          Write-Host "======================================"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:DAO_ROOT"
          Write-Host ""


      # ==========================================================
      # 3. RESTORE LAST BACKUP
      # ==========================================================

      - name: Find previous backup
        id: find_backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |

          $ErrorActionPreference = "Continue"

          $found = $false
          $runId = ""

          try {

            $runs = gh run list `
              --repo $env:REPOSITORY `
              --workflow windows-desktop.yml `
              --status completed `
              --limit 50 `
              --json databaseId,conclusion,createdAt |
              ConvertFrom-Json

            foreach ($run in $runs) {

              if ("$($run.databaseId)" -eq "$env:CURRENT_RUN") {
                continue
              }

              if ($run.conclusion -ne "success") {
                continue
              }

              try {

                $api =
                  "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                $artifacts =
                  gh api `
                    -H "Accept: application/vnd.github+json" `
                    $api |
                    ConvertFrom-Json

                $backup =
                  @(
                    $artifacts.artifacts |
                    Where-Object {
                      $_.name -eq $env:BACKUP_NAME -and
                      $_.expired -eq $false
                    }
                  ) |
                  Select-Object -First 1

                if ($backup) {

                  $found = $true
                  $runId = "$($run.databaseId)"

                  Write-Host "[OK] Previous backup found."
                  Write-Host "Run: $runId"

                  break
                }

              } catch {
                Write-Warning "Could not inspect run $($run.databaseId)"
              }
            }

          } catch {
            Write-Warning "Could not find previous backup."
          }

          "found=$($found.ToString().ToLower())" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          "run_id=$runId" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Download previous backup
        if: steps.find_backup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN: ${{ steps.find_backup.outputs.run_id }}
        run: |

          $ErrorActionPreference = "Stop"

          Remove-Item `
            $env:DAO_RESTORE `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force | Out-Null

          Write-Host "Downloading previous DAO backup..."

          gh run download `
            $env:BACKUP_RUN `
            --repo $env:REPOSITORY `
            --name $env:BACKUP_NAME `
            --dir $env:DAO_RESTORE

          if ($LASTEXITCODE -ne 0) {
            throw "Backup download failed."
          }

          Write-Host "[OK] Backup downloaded."


      - name: Restore previous workspace
        if: always()
        run: |

          $ErrorActionPreference = "Continue"

          $zip =
            Get-ChildItem `
              $env:DAO_RESTORE `
              -Recurse `
              -Filter "dao-state.zip" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $zip) {

            Write-Host "[INFO] No previous backup."
            exit 0
          }

          $temp =
            Join-Path `
              $env:TEMP `
              "dao-restore"

          Remove-Item `
            $temp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force | Out-Null

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath $temp `
            -Force

          Remove-Item `
            $env:DAO_ROOT `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_ROOT `
            -Force | Out-Null

          Copy-Item `
            "$temp\*" `
            $env:DAO_ROOT `
            -Recurse `
            -Force

          Write-Host "[OK] Previous workspace restored."


      # ==========================================================
      # 4. INSTALL FILEZILLA + NOTEPAD++
      # ==========================================================

      - name: Install applications
        run: |

          $ErrorActionPreference = "Continue"

          function Install-App {
            param(
              [string]$Id,
              [string]$Name
            )

            Write-Host ""
            Write-Host "Installing/checking $Name..."

            winget install `
              --id $Id `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -eq 0) {
              Write-Host "[OK] $Name ready."
            }
            else {
              Write-Warning "$Name returned exit code $LASTEXITCODE"
            }
          }

          Install-App `
            "FileZilla.FileZilla" `
            "FileZilla"

          Install-App `
            "Notepad++.Notepad++" `
            "Notepad++"


      # ==========================================================
      # 5. INSTALL ANYDESK
      # ==========================================================

      - name: Install AnyDesk
        run: |

          $ErrorActionPreference = "Stop"

          winget install `
            --id AnyDeskSoftwareGmbH.AnyDesk `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "AnyDesk installation returned $LASTEXITCODE"
          }

          Start-Sleep -Seconds 5


      # ==========================================================
      # 6. CONFIGURE REMOTE
      # ==========================================================

      - name: Configure AnyDesk
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          $anydesk = $null

          foreach ($path in @(
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk-*\AnyDesk*.exe",
            "${env:ProgramFiles(x86)}\AnyDesk-*\AnyDesk*.exe"
          )) {

            $item =
              Get-Item `
                $path `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

            if ($item) {
              $anydesk = $item.FullName
              break
            }
          }

          if (-not $anydesk) {

            $cmd =
              Get-Command `
                AnyDesk.exe `
                -ErrorAction SilentlyContinue

            if ($cmd) {
              $anydesk = $cmd.Source
            }
          }

          if (-not $anydesk) {
            throw "AnyDesk.exe not found."
          }

          Write-Host "AnyDesk: $anydesk"

          # Start AnyDesk
          Start-Process `
            -FilePath $anydesk `
            -ArgumentList "--start" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          # Set unattended access password
          if (
            [string]::IsNullOrWhiteSpace(
              $env:ANYDESK_PASSWORD
            )
          ) {
            throw "ANYDESK_PASSWORD secret is missing."
          }

          $psi =
            [System.Diagnostics.ProcessStartInfo]::new()

          $psi.FileName = $anydesk
          $psi.Arguments = "--set-password"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process =
            [System.Diagnostics.Process]::new()

          $process.StartInfo = $psi

          [void]$process.Start()

          $process.StandardInput.WriteLine(
            $env:ANYDESK_PASSWORD
          )

          $process.StandardInput.Close()

          $stdout =
            $process.StandardOutput.ReadToEnd()

          $stderr =
            $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          # Get ID
          $idOutput =
            & $anydesk `
              --get-id `
              2>&1

          $idText =
            ($idOutput | Out-String)

          $match =
            [regex]::Match(
              $idText,
              "\b\d{6,12}\b"
            )

          if (-not $match.Success) {

            Write-Host "AnyDesk output:"
            Write-Host $idText

            throw "Could not detect AnyDesk ID."
          }

          $anydeskId = $match.Value

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        DAO REMOTE DESKTOP"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Remote: AnyDesk"
          Write-Host "AnyDesk ID: $anydeskId"
          Write-Host "Password: GitHub Secret ANYDESK_PASSWORD"
          Write-Host ""
          Write-Host "Use this ID in AnyDesk to connect."
          Write-Host "======================================"
          Write-Host ""

          # Save ID as artifact/log information.
          # Password is intentionally NOT written.
          Set-Content `
            -Path "$env:DAO_ROOT\remote-info.txt" `
            -Value @"
DAO REMOTE

Remote software:
AnyDesk

AnyDesk ID:
$anydeskId

Password:
Stored in GitHub Secret ANYDESK_PASSWORD

Domain:
Not applicable for AnyDesk.

IP:
GitHub-hosted runner IP is dynamic.
Use AnyDesk ID instead.
"@


      # ==========================================================
      # 7. SHOW CONNECTION INFO
      # ==========================================================

      - name: Show connection information
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Get-Content `
            "$env:DAO_ROOT\remote-info.txt"

          Write-Host ""
          Write-Host "Applications:"
          Write-Host "  FileZilla"
          Write-Host "  Notepad++"
          Write-Host ""

          Write-Host "Runtime:"
          Write-Host "  04:00:00"
          Write-Host ""

          Write-Host "Backup:"
          Write-Host "  Previous backup restored if available"
          Write-Host "  New backup at 03:50:00"
          Write-Host ""


      # ==========================================================
      # 8. RUN FOR 3 HOURS 50 MINUTES
      # ==========================================================

      - name: Run desktop
        run: |

          $ErrorActionPreference = "Continue"

          $total = [int]$env:TOTAL_SECONDS
          $backupTime = $total - [int]$env:BACKUP_SECONDS

          $start = Get-Date

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO DESKTOP IS ACTIVE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Total runtime: 4 hours"
          Write-Host "Backup starts after: 3 hours 50 minutes"
          Write-Host ""

          while ($true) {

            $elapsed =
              [int]((Get-Date) - $start).TotalSeconds

            if ($elapsed -ge $backupTime) {
              break
            }

            $remaining =
              $backupTime - $elapsed

            $hours =
              [math]::Floor($remaining / 3600)

            $minutes =
              [math]::Floor(($remaining % 3600) / 60)

            $seconds =
              $remaining % 60

            Write-Host (
              "Desktop active | " +
              "Backup in {0:D2}:{1:D2}:{2:D2}" -f `
              $hours,
              $minutes,
              $seconds
            )

            Start-Sleep -Seconds 30
          }


      # ==========================================================
      # 9. BACKUP 10 MINUTES BEFORE END
      # ==========================================================

      - name: Create final backup
        if: always()
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             DAO BACKUP"
          Write-Host "=============================================="
          Write-Host ""

          # Stop AnyDesk before backup
          Get-Process `
            -Name AnyDesk,anydesk `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Remove-Item `
            $env:DAO_BACKUP `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_BACKUP `
            -Force | Out-Null

          $temp =
            Join-Path `
              $env:TEMP `
              "dao-backup"

          Remove-Item `
            $temp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force | Out-Null

          # Copy workspace
          Copy-Item `
            "$env:DAO_ROOT\*" `
            $temp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          $zip =
            Join-Path `
              $env:DAO_BACKUP `
              "dao-state.zip"

          Compress-Archive `
            -Path "$temp\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          @"
DAO WINDOWS DESKTOP BACKUP

Repository:
$env:GITHUB_REPOSITORY

Run:
$env:GITHUB_RUN_ID

Created:
$(Get-Date -Format "yyyy-MM-dd HH:mm:ss")

Runtime:
4 hours

Backup:
Created 10 minutes before shutdown.

Applications:
FileZilla
Notepad++

Remote:
AnyDesk

Secrets:
Not included.
"@ |
            Set-Content `
              "$env:DAO_BACKUP\backup-info.txt" `
              -Encoding UTF8

          Write-Host "[OK] Backup created."

          Get-ChildItem `
            $env:DAO_BACKUP `
            -Recurse `
            -File |
            Select-Object Name,Length |
            Format-Table -AutoSize


      # ==========================================================
      # 10. UPLOAD BACKUP
      # ==========================================================

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6


      # ==========================================================
      # 11. WAIT REMAINING 10 MINUTES
      # ==========================================================

      - name: Final 10 minutes
        if: always()
        run: |

          Write-Host ""
          Write-Host "Backup completed."
          Write-Host "Waiting for final 10 minutes..."
          Write-Host ""

          Start-Sleep -Seconds 600


      # ==========================================================
      # 12. FINISH
      # ==========================================================

      - name: Finish
        if: always()
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP END"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Runtime: 4 hours"
          Write-Host "Backup: completed"
          Write-Host "Next run: previous backup will be restored."
          Write-Host ""
