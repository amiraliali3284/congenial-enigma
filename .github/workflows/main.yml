name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO-Workspace
  DAO_BACKUP: D:\DAO-Backup
  DAO_RESTORE: D:\DAO-Restore
  BACKUP_NAME: dao-windows-backup

jobs:
  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare directories
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_ROOT `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_BACKUP `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force | Out-Null

          Write-Host "DAO workspace ready."

      - name: Find previous backup
        id: find_backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          $found = $false
          $runId = ''

          try {
            $runs = gh run list `
              --repo $env:REPOSITORY `
              --workflow windows-desktop.yml `
              --status completed `
              --limit 50 `
              --json databaseId,conclusion,createdAt |
              ConvertFrom-Json

            foreach ($run in $runs) {

              if ("$($run.databaseId)" -eq "$env:CURRENT_RUN") {
                continue
              }

              if ($run.conclusion -ne 'success') {
                continue
              }

              try {
                $api = "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                $result = gh api `
                  -H "Accept: application/vnd.github+json" `
                  $api |
                  ConvertFrom-Json

                $artifact = @(
                  $result.artifacts |
                  Where-Object {
                    $_.name -eq $env:BACKUP_NAME -and
                    $_.expired -eq $false
                  }
                ) |
                Select-Object -First 1

                if ($null -ne $artifact) {
                  $found = $true
                  $runId = "$($run.databaseId)"
                  break
                }

              }
              catch {
                Write-Warning "Could not inspect run $($run.databaseId)."
              }
            }
          }
          catch {
            Write-Warning "Backup discovery failed."
          }

          "found=$($found.ToString().ToLowerInvariant())" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "run_id=$runId" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      - name: Download previous backup
        if: steps.find_backup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN: ${{ steps.find_backup.outputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            $env:DAO_RESTORE `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force | Out-Null

          Write-Host "Downloading previous backup..."

          gh run download `
            $env:BACKUP_RUN `
            --repo $env:REPOSITORY `
            --name $env:BACKUP_NAME `
            --dir $env:DAO_RESTORE

          if ($LASTEXITCODE -ne 0) {
            throw 'Backup download failed.'
          }

          Write-Host '[OK] Backup downloaded.'

      - name: Restore previous backup
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Get-ChildItem `
            $env:DAO_RESTORE `
            -Recurse `
            -Filter 'dao-state.zip' `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $zip) {
            Write-Host '[INFO] No previous backup found.'
            exit 0
          }

          $temp = Join-Path `
            $env:TEMP `
            'dao-restore'

          Remove-Item `
            $temp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force | Out-Null

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath $temp `
            -Force

          Remove-Item `
            $env:DAO_ROOT `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_ROOT `
            -Force | Out-Null

          Copy-Item `
            "$temp\*" `
            $env:DAO_ROOT `
            -Recurse `
            -Force

          Write-Host '[OK] Previous backup restored.'

      - name: Install FileZilla and Notepad++
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host 'Installing FileZilla...'

          winget install `
            --id FileZilla.FileZilla `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host 'Installing Notepad++...'

          winget install `
            --id Notepad++.Notepad++ `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host '[OK] Applications installed.'

      - name: Install AnyDesk
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host 'Installing AnyDesk...'

          winget install `
            --id AnyDeskSoftwareGmbH.AnyDesk `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Start-Sleep -Seconds 5

      - name: Configure AnyDesk
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw 'GitHub Secret ANYDESK_PASSWORD is missing.'
          }

          $anydesk = $null

          $paths = @(
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              $anydesk = $path
              break
            }
          }

          if (-not $anydesk) {
            $cmd = Get-Command AnyDesk.exe -ErrorAction SilentlyContinue

            if ($cmd) {
              $anydesk = $cmd.Source
            }
          }

          if (-not $anydesk) {
            throw 'AnyDesk.exe was not found.'
          }

          Write-Host "AnyDesk: $anydesk"

          Start-Process `
            -FilePath $anydesk `
            -ArgumentList '--start' `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          $psi = [System.Diagnostics.ProcessStartInfo]::new()

          $psi.FileName = $anydesk
          $psi.Arguments = '--set-password'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process = [System.Diagnostics.Process]::new()

          $process.StartInfo = $psi

          [void]$process.Start()

          $process.StandardInput.WriteLine(
            $env:ANYDESK_PASSWORD
          )

          $process.StandardInput.Close()

          $null = $process.StandardOutput.ReadToEnd()
          $null = $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          $idOutput = & $anydesk --get-id 2>&1

          $idText = $idOutput | Out-String

          $match = [regex]::Match(
            $idText,
            '\b\d{6,12}\b'
          )

          if (-not $match.Success) {
            throw 'Could not detect AnyDesk ID.'
          }

          $anydeskId = $match.Value

          $remoteInfo = @(
            'DAO REMOTE'
            ''
            'Remote: AnyDesk'
            "AnyDesk ID: $anydeskId"
            'Password: GitHub Secret ANYDESK_PASSWORD'
            'IP: Dynamic GitHub-hosted runner IP'
            'Domain: Not applicable'
            ''
            'Use the AnyDesk ID to connect.'
          )

          $remoteInfo |
            Set-Content `
              -Path (
                Join-Path `
                  $env:DAO_ROOT `
                  'remote-info.txt'
              ) `
              -Encoding UTF8

          Write-Host ''
          Write-Host '======================================'
          Write-Host 'DAO REMOTE DESKTOP'
          Write-Host '======================================'
          Write-Host "AnyDesk ID: $anydeskId"
          Write-Host 'Password: GitHub Secret ANYDESK_PASSWORD'
          Write-Host '======================================'

      - name: Show connection information
        run: |
          Write-Host ''
          Write-Host '======================================'
          Write-Host 'DAO WINDOWS DESKTOP'
          Write-Host '======================================'
          Write-Host ''

          Get-Content `
            (Join-Path `
              $env:DAO_ROOT `
              'remote-info.txt')

          Write-Host ''
          Write-Host 'Applications:'
          Write-Host '  FileZilla'
          Write-Host '  Notepad++'
          Write-Host ''

          Write-Host 'Runtime: 4 hours'
          Write-Host 'Backup: 10 minutes before end'
          Write-Host ''

      - name: Keep desktop alive for 3 hours 50 minutes
        run: |
          $seconds = 13800
          $start = Get-Date

          Write-Host ''
          Write-Host 'Desktop is active.'
          Write-Host 'Backup will start after 3 hours 50 minutes.'
          Write-Host ''

          while (
            ((Get-Date) - $start).TotalSeconds -lt $seconds
          ) {

            $elapsed = [int](
              ((Get-Date) - $start).TotalSeconds
            )

            $remaining = $seconds - $elapsed

            $h = [math]::Floor(
              $remaining / 3600
            )

            $m = [math]::Floor(
              ($remaining % 3600) / 60
            )

            $s = $remaining % 60

            Write-Host (
              'Backup in {0:D2}:{1:D2}:{2:D2}' -f `
              $h,
              $m,
              $s
            )

            Start-Sleep -Seconds 30
          }

      - name: Create backup
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ''
          Write-Host '======================================'
          Write-Host 'CREATING DAO BACKUP'
          Write-Host '======================================'

          Remove-Item `
            $env:DAO_BACKUP `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_BACKUP `
            -Force | Out-Null

          $temp = Join-Path `
            $env:TEMP `
            'dao-backup'

          Remove-Item `
            $temp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force | Out-Null

          if (Test-Path -LiteralPath $env:DAO_ROOT) {

            Copy-Item `
              "$env:DAO_ROOT\*" `
              $temp `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $zip = Join-Path `
            $env:DAO_BACKUP `
            'dao-state.zip'

          Compress-Archive `
            -Path "$temp\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          $backupInfo = @(
            'DAO Windows Desktop Backup'
            "Repository: $env:GITHUB_REPOSITORY"
            "Run ID: $env:GITHUB_RUN_ID"
            "Created: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            'Runtime: 4 hours'
            'Backup created 10 minutes before end.'
          )

          $backupInfo |
            Set-Content `
              (
                Join-Path `
                  $env:DAO_BACKUP `
                  'backup-info.txt'
              ) `
              -Encoding UTF8

          Write-Host '[OK] Backup created.'

          Get-ChildItem `
            $env:DAO_BACKUP `
            -Recurse `
            -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Final 10 minutes
        if: always()
        run: |
          Write-Host ''
          Write-Host 'Backup completed.'
          Write-Host 'Waiting for final 10 minutes...'
          Write-Host ''

          Start-Sleep -Seconds 600

      - name: Finish
        if: always()
        run: |
          Write-Host ''
          Write-Host '======================================'
          Write-Host 'DAO WINDOWS DESKTOP FINISHED'
          Write-Host '======================================'
          Write-Host ''
          Write-Host 'Runtime: 4 hours'
          Write-Host 'Backup: completed'
          Write-Host 'Next run: previous backup will be restored.'
