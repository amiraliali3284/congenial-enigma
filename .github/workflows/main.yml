name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO
  DAO_BACKUP: D:\DAO-BACKUP
  DAO_LOGS: D:\DAO-LOGS
  DAO_TOOLS: D:\DAO-TOOLS

  VNC_PORT: "5900"
  NOVNC_PORT: "6080"

  RUNTIME_SECONDS: "240"

jobs:
  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      # ==========================================================
      # 2. INITIALIZE
      # ==========================================================

      - name: Initialize
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path $env:DAO_ROOT -Force | Out-Null
          New-Item -ItemType Directory -Path $env:DAO_BACKUP -Force | Out-Null
          New-Item -ItemType Directory -Path $env:DAO_LOGS -Force | Out-Null
          New-Item -ItemType Directory -Path $env:DAO_TOOLS -Force | Out-Null

          Write-Host "=========================================="
          Write-Host "DAO WINDOWS DESKTOP"
          Write-Host "=========================================="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace: $env:DAO_ROOT"

      # ==========================================================
      # 3. RESTORE PREVIOUS BACKUP
      # ==========================================================

      - name: Find previous backup
        id: backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Continue"

          $found = $false
          $runId = ""

          try {
            $runs = gh run list `
              --repo $env:REPOSITORY `
              --workflow windows-desktop.yml `
              --status completed `
              --limit 30 `
              --json databaseId,conclusion

            if ($LASTEXITCODE -eq 0 -and $runs) {
              $items = $runs | ConvertFrom-Json

              foreach ($run in $items) {
                if ([string]$run.databaseId -eq [string]$env:CURRENT_RUN) {
                  continue
                }

                if ($run.conclusion -ne "success") {
                  continue
                }

                try {
                  $api = "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                  $artifactData = gh api `
                    -H "Accept: application/vnd.github+json" `
                    $api

                  if ($LASTEXITCODE -ne 0) {
                    continue
                  }

                  $artifactResponse = $artifactData | ConvertFrom-Json

                  $artifact = @(
                    $artifactResponse.artifacts |
                    Where-Object {
                      $_.name -eq "dao-windows-backup" -and
                      $_.expired -eq $false
                    }
                  ) | Select-Object -First 1

                  if ($artifact) {
                    $found = $true
                    $runId = [string]$run.databaseId

                    Write-Host "[OK] Backup found."
                    Write-Host "Backup Run: $runId"

                    break
                  }
                }
                catch {
                  Write-Warning "Could not inspect run $($run.databaseId)"
                }
              }
            }
          }
          catch {
            Write-Warning "Backup search failed."
          }

          "found=$($found.ToString().ToLower())" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          "run_id=$runId" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download previous backup
        if: steps.backup.outputs.found == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN: ${{ steps.backup.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $restore = Join-Path $env:DAO_TOOLS "restore"

          if (Test-Path $restore) {
            Remove-Item $restore -Recurse -Force
          }

          New-Item -ItemType Directory -Path $restore -Force | Out-Null

          Write-Host "Downloading previous backup..."

          gh run download `
            $env:BACKUP_RUN `
            --repo $env:REPOSITORY `
            --name dao-windows-backup `
            --dir $restore

          if ($LASTEXITCODE -ne 0) {
            throw "Backup download failed."
          }

          $zip = Get-ChildItem `
            -Path $restore `
            -Filter "dao-state.zip" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "No dao-state.zip found."
            exit 0
          }

          $extract = Join-Path $env:DAO_TOOLS "restore-extract"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath $extract `
            -Force

          $items = Get-ChildItem `
            -Path $extract `
            -Force `
            -ErrorAction SilentlyContinue

          foreach ($item in $items) {
            $destination = Join-Path $env:DAO_ROOT $item.Name

            if (Test-Path $destination) {
              Remove-Item $destination -Recurse -Force
            }

            Move-Item `
              -Path $item.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host "[OK] Previous DAO state restored."

      # ==========================================================
      # 4. INSTALL FILEZILLA + NOTEPAD++
      # ==========================================================

      - name: Install applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Checking winget..."

          winget --version

          Write-Host ""
          Write-Host "Installing FileZilla..."

          winget install `
            --id FileZilla.FileZilla `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host ""
          Write-Host "Installing Notepad++..."

          winget install `
            --id Notepad++.Notepad++ `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host ""
          Write-Host "Installing TightVNC..."

          winget install `
            --id GlavSoft.TightVNC `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

      # ==========================================================
      # 5. DOWNLOAD NOVNC
      # ==========================================================

      - name: Prepare noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $novnc = Join-Path $env:DAO_ROOT "noVNC"
          $zip = Join-Path $env:DAO_TOOLS "novnc.zip"
          $extract = Join-Path $env:DAO_TOOLS "novnc-extract"

          if (Test-Path $novnc) {
            Remove-Item $novnc -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null

          Write-Host "Downloading noVNC..."

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $source = Join-Path $extract "noVNC-1.7.0"

          if (-not (Test-Path $source)) {
            throw "noVNC extraction failed."
          }

          Move-Item `
            -Path $source `
            -Destination $novnc `
            -Force

          if (-not (Test-Path (Join-Path $novnc "vnc.html"))) {
            throw "vnc.html not found."
          }

          Write-Host "[OK] noVNC ready."

      # ==========================================================
      # 6. CONFIGURE VNC
      # ==========================================================

      - name: Configure TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Create GitHub Secret named VNC_PASSWORD first."
          }

          $vnc = $null

          $paths = @(
            "$env:ProgramFiles\TightVNC\tvnserver.exe",
            "$env:ProgramFiles\TightVNC\winvnc.exe",
            "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe",
            "${env:ProgramFiles(x86)}\TightVNC\winvnc.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $vnc = $path
              break
            }
          }

          if (-not $vnc) {
            throw "TightVNC executable not found."
          }

          $reg = "HKLM:\SOFTWARE\TightVNC\Server"

          New-Item `
            -Path $reg `
            -Force `
            -ErrorAction SilentlyContinue |
            Out-Null

          $password = $env:VNC_PASSWORD

          if ($password.Length -gt 8) {
            $password = $password.Substring(0, 8)
          }

          while ($password.Length -lt 8) {
            $password += [char]0
          }

          $key = [byte[]](
            0x17,
            0x52,
            0x6B,
            0x8E,
            0x17,
            0x52,
            0x6B,
            0x8E
          )

          $plain = [System.Text.Encoding]::ASCII.GetBytes($password)

          $des = [System.Security.Cryptography.DES]::Create()

          try {
            $des.Mode = [System.Security.Cryptography.CipherMode]::ECB
            $des.Padding = [System.Security.Cryptography.PaddingMode]::None
            $des.Key = $key

            $encrypted = $des.CreateEncryptor().TransformFinalBlock(
              $plain,
              0,
              8
            )
          }
          finally {
            $des.Dispose()
          }

          New-ItemProperty `
            -Path $reg `
            -Name Password `
            -PropertyType Binary `
            -Value $encrypted `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $reg `
            -Name UseVncAuthentication `
            -PropertyType DWord `
            -Value 1 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $reg `
            -Name RfbPort `
            -PropertyType DWord `
            -Value 5900 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $reg `
            -Name LoopbackOnly `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          & $vnc -stop -silent 2>&1 | Out-Null

          Start-Sleep -Seconds 2

          & $vnc -start -silent 2>&1 |
            Out-File `
              (Join-Path $env:DAO_LOGS "vnc.log") `
              -Append

          Start-Sleep -Seconds 5

          Write-Host "[OK] TightVNC started."

      # ==========================================================
      # 7. INSTALL WEBSOCKIFY
      # ==========================================================

      - name: Install websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python --version

          python -m pip install `
            --disable-pip-version-check `
            --no-input `
            --upgrade `
            websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          Write-Host "[OK] websockify installed."

      # ==========================================================
      # 8. START REMOTE DESKTOP
      # ==========================================================

      - name: Start Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $novnc = Join-Path $env:DAO_ROOT "noVNC"

          $webLog = Join-Path $env:DAO_LOGS "websockify.log"
          $webError = Join-Path $env:DAO_LOGS "websockify-error.log"

          $cloudLog = Join-Path $env:DAO_LOGS "cloudflare.log"
          $cloudError = Join-Path $env:DAO_LOGS "cloudflare-error.log"

          Write-Host "Starting websockify..."

          $websockify = $null

          $commands = @(
            "websockify.exe",
            "websockify"
          )

          foreach ($name in $commands) {
            $command = Get-Command $name -ErrorAction SilentlyContinue

            if ($command) {
              $websockify = $command.Source
              break
            }
          }

          if (-not $websockify) {
            throw "websockify executable not found."
          }

          Start-Process `
            -FilePath $websockify `
            -ArgumentList @(
              "--web",
              $novnc,
              "6080",
              "127.0.0.1:5900"
            ) `
            -WorkingDirectory $novnc `
            -RedirectStandardOutput $webLog `
            -RedirectStandardError $webError `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          $webPort = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $webPort) {
            Write-Host "websockify error log:"

            if (Test-Path $webError) {
              Get-Content $webError -Tail 100
            }

            throw "Port 6080 is not listening."
          }

          Write-Host "[OK] noVNC running on port 6080."

          # --------------------------------------------------------
          # Install cloudflared if required
          # --------------------------------------------------------

          $cloudflared = Get-Command cloudflared.exe -ErrorAction SilentlyContinue

          if (-not $cloudflared) {
            $cloudflaredPath = Join-Path $env:DAO_TOOLS "cloudflared.exe"

            Write-Host "Downloading cloudflared..."

            Invoke-WebRequest `
              -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
              -OutFile $cloudflaredPath `
              -UseBasicParsing

            $cloudflared = Get-Item $cloudflaredPath
          }

          Write-Host "Starting Cloudflare Quick Tunnel..."

          Start-Process `
            -FilePath $cloudflared.Source `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $cloudLog `
            -RedirectStandardError $cloudError `
            -WindowStyle Hidden

          $publicUrl = $null
          $deadline = (Get-Date).AddSeconds(120)

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2

            $text = ""

            if (Test-Path $cloudLog) {
              $text += "`n" + (Get-Content $cloudLog -Raw)
            }

            if (Test-Path $cloudError) {
              $text += "`n" + (Get-Content $cloudError -Raw)
            }

            $match = [regex]::Match(
              $text,
              "https://[a-zA-Z0-9-]+\.trycloudflare\.com"
            )

            if ($match.Success) {
              $publicUrl = $match.Value
              break
            }
          }

          if (-not $publicUrl) {
            Write-Host "Cloudflare output:"

            if (Test-Path $cloudLog) {
              Get-Content $cloudLog -Tail 100
            }

            if (Test-Path $cloudError) {
              Get-Content $cloudError -Tail 100
            }

            throw "Cloudflare tunnel URL was not found."
          }

          $remoteUrl = "$publicUrl/vnc.html"

          Set-Content `
            -Path (Join-Path $env:DAO_LOGS "remote-url.txt") `
            -Value $remoteUrl `
            -NoNewline

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Domain:"
          Write-Host $publicUrl
          Write-Host ""
          Write-Host "Remote URL:"
          Write-Host $remoteUrl
          Write-Host ""
          Write-Host "VNC IP:"
          Write-Host "127.0.0.1:5900"
          Write-Host ""
          Write-Host "VNC Username:"
          Write-Host "Not required"
          Write-Host ""
          Write-Host "VNC Password:"
          Write-Host "GitHub Secret: VNC_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="

      # ==========================================================
      # 9. SHOW CONNECTION INFORMATION
      # ==========================================================

      - name: Show connection information
        shell: pwsh
        run: |
          $urlFile = Join-Path $env:DAO_LOGS "remote-url.txt"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DAO REMOTE CONNECTION"
          Write-Host "=========================================="

          if (Test-Path $urlFile) {
            $url = Get-Content $urlFile -Raw
            Write-Host "Domain:"
            Write-Host $url
          }

          Write-Host ""
          Write-Host "Username: Not required"
          Write-Host "Password: GitHub Secret VNC_PASSWORD"
          Write-Host ""
          Write-Host "FileZilla: Installed"
          Write-Host "Notepad++: Installed"
          Write-Host "=========================================="

      # ==========================================================
      # 10. RUN DESKTOP
      # ==========================================================

      - name: Run DAO Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $totalSeconds = 240
          $backupAt = 230

          $start = Get-Date

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DAO DESKTOP ACTIVE"
          Write-Host "Runtime: 4 hours"
          Write-Host "Backup: 10 minutes before shutdown"
          Write-Host "=========================================="

          while ($true) {
            $elapsed = [int]((Get-Date - $start).TotalSeconds)

            if ($elapsed -ge $totalSeconds) {
              break
            }

            $remaining = $totalSeconds - $elapsed

            $hours = [math]::Floor($elapsed / 3600)
            $minutes = [math]::Floor(($elapsed % 3600) / 60)
            $seconds = $elapsed % 60

            $leftHours = [math]::Floor($remaining / 3600)
            $leftMinutes = [math]::Floor(($remaining % 3600) / 60)
            $leftSeconds = $remaining % 60

            Write-Host (
              "Runtime {0:D2}:{1:D2}:{2:D2} | Remaining {3:D2}:{4:D2}:{5:D2}" -f `
              $hours,
              $minutes,
              $seconds,
              $leftHours,
              $leftMinutes,
              $leftSeconds
            )

            Start-Sleep -Seconds 15
          }

          Write-Host "Runtime finished."

      # ==========================================================
      # 11. BACKUP
      # ==========================================================

      - name: Create final backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CREATING DAO BACKUP"
          Write-Host "=========================================="

          $temp = Join-Path $env:DAO_TOOLS "backup-state"
          $zip = Join-Path $env:DAO_BACKUP "dao-state.zip"

          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force |
            Out-Null

          if (Test-Path $env:DAO_ROOT) {
            Get-ChildItem `
              -Path $env:DAO_ROOT `
              -Force `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -ne "noVNC"
              } |
              ForEach-Object {
                try {
                  Copy-Item `
                    -Path $_.FullName `
                    -Destination (Join-Path $temp $_.Name) `
                    -Recurse `
                    -Force
                }
                catch {
                  Write-Warning "Could not backup $($_.Name)"
                }
              }
          }

          Compress-Archive `
            -Path (Join-Path $temp "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          $backupInfo = @(
            "DAO WINDOWS DESKTOP BACKUP"
            ""
            "Repository:"
            $env:GITHUB_REPOSITORY
            ""
            "Run:"
            $env:GITHUB_RUN_ID
            ""
            "Created:"
            (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
            ""
            "Applications:"
            "FileZilla"
            "Notepad++"
            ""
            "Remote:"
            "TightVNC + noVNC"
            ""
            "Secrets:"
            "Not stored"
          )

          $backupInfo |
            Set-Content `
              -Path (Join-Path $env:DAO_BACKUP "backup-info.txt") `
              -Encoding UTF8

          Write-Host "[OK] Backup created."

      # ==========================================================
      # 12. UPLOAD BACKUP
      # ==========================================================

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-BACKUP
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # ==========================================================
      # 13. STOP SERVICES
      # ==========================================================

      - name: Stop services
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Stopping remote services..."

          Get-Process `
            -Name cloudflared `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Get-Process `
            -Name websockify `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          $vnc = $null

          $paths = @(
            "$env:ProgramFiles\TightVNC\tvnserver.exe",
            "$env:ProgramFiles\TightVNC\winvnc.exe",
            "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe",
            "${env:ProgramFiles(x86)}\TightVNC\winvnc.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $vnc = $path
              break
            }
          }

          if ($vnc) {
            & $vnc -stop -silent 2>&1 | Out-Null
          }

          Write-Host "[OK] Services stopped."

      # ==========================================================
      # 14. UPLOAD LOGS
      # ==========================================================

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-LOGS
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ==========================================================
      # 15. FINAL
      # ==========================================================

      - name: Final
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DAO WINDOWS DESKTOP FINISHED"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Backup artifact:"
          Write-Host "dao-windows-backup"
          Write-Host ""
          Write-Host "Logs artifact:"
          Write-Host "dao-windows-logs"
          Write-Host ""
          Write-Host "Next run:"
          Write-Host "Previous backup will be restored automatically."
          Write-Host ""
          Write-Host "=========================================="
