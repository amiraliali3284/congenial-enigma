name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      WORKSPACE: D:\DAO-Workspace
      BACKUP: D:\DAO-Backup
      LOGDIR: D:\DAO-Logs

    steps:

      # ============================================================
      # 1. PREPARE
      # ============================================================

      - name: Prepare environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:WORKSPACE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:BACKUP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LOGDIR | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host "Workspace : $env:WORKSPACE"
          Write-Host "Backup    : $env:BACKUP"
          Write-Host "Logs      : $env:LOGDIR"
          Write-Host "=============================================="

      # ============================================================
      # 2. FIND LAST BACKUP
      # ============================================================

      - name: Find previous backup
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=dao-windows-backup&per_page=100"

          try {
            $response = Invoke-RestMethod `
              -Uri $url `
              -Headers $headers `
              -Method Get

            $artifact = $response.artifacts |
              Where-Object { $_.expired -eq $false } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {
              Write-Host "Previous backup found."
              Write-Host "Artifact ID: $($artifact.id)"
              Write-Host "Created: $($artifact.created_at)"

              "artifact_id=$($artifact.id)" |
                Out-File $env:GITHUB_OUTPUT -Append
            }
            else {
              Write-Host "No previous backup found."

              "artifact_id=" |
                Out-File $env:GITHUB_OUTPUT -Append
            }
          }
          catch {
            Write-Warning "Could not query previous artifacts."
            Write-Warning $_

            "artifact_id=" |
              Out-File $env:GITHUB_OUTPUT -Append
          }

      # ============================================================
      # 3. RESTORE
      # ============================================================

      - name: Restore previous backup
        if: steps.previous.outputs.artifact_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactId = "${{ steps.previous.outputs.artifact_id }}"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $zip = "$env:TEMP\dao-backup.zip"

          Write-Host "Downloading previous backup..."

          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" `
            -Headers $headers `
            -OutFile $zip

          Write-Host "Extracting backup..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $env:BACKUP `
            -Force

          # Restore workspace
          if (Test-Path "$env:BACKUP\workspace") {

            Write-Host "Restoring workspace..."

            Get-ChildItem `
              "$env:BACKUP\workspace" `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $env:WORKSPACE `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # Restore FileZilla
          $fzBackup = "$env:BACKUP\FileZilla"

          if (Test-Path $fzBackup) {

            $fzTarget = "$env:APPDATA\FileZilla"

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $fzTarget |
              Out-Null

            Get-ChildItem `
              $fzBackup `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $fzTarget `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # Restore Geany
          $geanyBackup = "$env:BACKUP\Geany"

          if (Test-Path $geanyBackup) {

            $geanyTarget = "$env:APPDATA\geany"

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $geanyTarget |
              Out-Null

            Get-ChildItem `
              $geanyBackup `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $geanyTarget `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Restore completed."

      # ============================================================
      # 4. INSTALL WINGET PACKAGES
      # ============================================================

      - name: Install applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "Installing applications..."
          Write-Host ""

          # FileZilla
          winget install `
            --id FileZilla.FileZilla `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          # Geany
          winget install `
            --id Geany.Geany `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host ""
          Write-Host "Basic applications installed."

      # ============================================================
      # 5. INSTALL TIGHTVNC
      # ============================================================

      - name: Install VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing TightVNC..."

          $url = "https://www.tightvnc.com/download/2.8.88/tightvnc-2.8.88-gpl-setup-64bit.msi"

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "TightVNC installer download failed."
          }

          Start-Process `
            msiexec.exe `
            -ArgumentList @(
              "/i"
              "`"$installer`""
              "/quiet"
              "/norestart"
              "ADDLOCAL=Server,Viewer"
              "SERVER_REGISTER_AS_SERVICE=1"
              "SERVER_ADD_FIREWALL_EXCEPTION=1"
            ) `
            -Wait

          Write-Host "TightVNC installed."

      # ============================================================
      # 6. START VNC
      # ============================================================

      - name: Start VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vnc = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc = "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (!(Test-Path $vnc)) {
            Write-Warning "TightVNC executable not found."
            exit 0
          }

          Write-Host "Starting TightVNC service..."

          & $vnc -start -silent

          Start-Sleep -Seconds 5

          Get-Service |
            Where-Object {
              $_.Name -match "tvn|tight"
            } |
            Format-Table -AutoSize

          Write-Host "VNC startup completed."

      # ============================================================
      # 7. INSTALL ANYDESK
      # ============================================================

      - name: Install AnyDesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD GitHub Secret is missing."
          }

          Write-Host "Downloading AnyDesk..."

          $installer = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "AnyDesk download failed."
          }

          Write-Host "Installing AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList `
              '--install "C:\Program Files (x86)\AnyDesk" --start-with-win --silent' `
            -Wait

          Start-Sleep -Seconds 10

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {

            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk executable not found."
          }

          Write-Host "AnyDesk installed."

          # Start AnyDesk
          Start-Process `
            -FilePath $anydesk

          Start-Sleep -Seconds 8

          # Configure unattended access through stdin.
          # The password is never written into the YAML/log.
          $env:ANYDESK_PASSWORD |
            & $anydesk --set-password _unattended_access

          Start-Sleep -Seconds 3

          Write-Host "AnyDesk configured."

      # ============================================================
      # 8. GET ANYDESK ID
      # ============================================================

      - name: Get AnyDesk ID
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (Test-Path $anydesk) {

            Start-Sleep -Seconds 5

            $id = & $anydesk --get-id 2>$null |
              Out-String

            $id = $id.Trim()

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "               ANYDESK"
            Write-Host "=============================================="
            Write-Host "AnyDesk ID: $id"
            Write-Host "=============================================="
            Write-Host ""

            Set-Content `
              -Path "$env:LOGDIR\anydesk-id.txt" `
              -Value $id
          }
          else {
            Write-Warning "AnyDesk executable not found."
          }

      # ============================================================
      # 9. CREATE DESKTOP SHORTCUT
      # ============================================================

      - name: Create DAO shortcuts
        shell: pwsh
        run: |
          $desktop =
            [Environment]::GetFolderPath("Desktop")

          $shell =
            New-Object -ComObject WScript.Shell

          # Workspace
          $shortcut =
            $shell.CreateShortcut(
              "$desktop\DAO Workspace.lnk"
            )

          $shortcut.TargetPath =
            "explorer.exe"

          $shortcut.Arguments =
            "`"$env:WORKSPACE`""

          $shortcut.Save()

          Write-Host "Workspace shortcut created."

      # ============================================================
      # 10. START FILEZILLA + GEANY
      # ============================================================

      - name: Start applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $filezillaPaths = @(
            "C:\Program Files\FileZilla FTP Client\filezilla.exe",
            "C:\Program Files (x86)\FileZilla FTP Client\filezilla.exe"
          )

          $geanyPaths = @(
            "C:\Program Files\Geany\bin\geany.exe",
            "C:\Program Files (x86)\Geany\bin\geany.exe"
          )

          foreach ($path in $filezillaPaths) {

            if (Test-Path $path) {

              Write-Host "Starting FileZilla..."

              Start-Process `
                -FilePath $path

              break
            }
          }

          foreach ($path in $geanyPaths) {

            if (Test-Path $path) {

              Write-Host "Starting Geany..."

              Start-Process `
                -FilePath $path

              break
            }
          }

      # ============================================================
      # 11. SYSTEM INFORMATION
      # ============================================================

      - name: Show desktop information
        shell: pwsh
        run: |
          $anydeskID = "Unavailable"

          if (Test-Path "$env:LOGDIR\anydesk-id.txt") {

            $anydeskID =
              Get-Content "$env:LOGDIR\anydesk-id.txt"
          }

          $info = @"
          ==============================================
                  DAO WINDOWS DESKTOP
          ==============================================

          Windows:
          Windows 2025 Runner

          Applications:
          - FileZilla
          - Geany
          - AnyDesk
          - TightVNC

          Workspace:
          $env:WORKSPACE

          AnyDesk ID:
          $anydeskID

          VNC:
          TCP 5900

          Runtime:
          4 hours maximum

          ==============================================
          "@

          Write-Host $info

          Set-Content `
            -Path "$env:LOGDIR\connection-info.txt" `
            -Value $info

      # ============================================================
      # 12. KEEP ALIVE FOR 4 HOURS
      # ============================================================

      - name: Keep desktop alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DAO WINDOWS DESKTOP IS RUNNING"
          Write-Host " Maximum runtime: 4 HOURS"
          Write-Host "=============================================="
          Write-Host ""

          for ($i = 1; $i -le 240; $i++) {

            $time =
              Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$time] Desktop active: $i / 240 minutes"

            Start-Sleep -Seconds 60
          }

      # ============================================================
      # 13. BACKUP
      # ============================================================

      - name: Prepare backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Preparing backup..."

          # Clean old backup
          if (Test-Path $env:BACKUP) {

            Remove-Item `
              "$env:BACKUP\*" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:BACKUP |
            Out-Null

          # --------------------------------------------------------
          # Workspace
          # --------------------------------------------------------

          $workspaceBackup =
            "$env:BACKUP\workspace"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $workspaceBackup |
            Out-Null

          if (Test-Path $env:WORKSPACE) {

            Get-ChildItem `
              $env:WORKSPACE `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $workspaceBackup `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Workspace item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # FileZilla
          # --------------------------------------------------------

          $fzSource =
            "$env:APPDATA\FileZilla"

          $fzTarget =
            "$env:BACKUP\FileZilla"

          if (Test-Path $fzSource) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $fzTarget |
              Out-Null

            Get-ChildItem `
              $fzSource `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $fzTarget `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "FileZilla item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Geany
          # --------------------------------------------------------

          $geanySource =
            "$env:APPDATA\geany"

          $geanyTarget =
            "$env:BACKUP\Geany"

          if (Test-Path $geanySource) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $geanyTarget |
              Out-Null

            Get-ChildItem `
              $geanySource `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $geanyTarget `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Geany item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Documents - ONLY ACCESSIBLE FILES
          # --------------------------------------------------------

          $documents =
            [Environment]::GetFolderPath("MyDocuments")

          $documentsBackup =
            "$env:BACKUP\Documents"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $documentsBackup |
            Out-Null

          if (Test-Path $documents) {

            Get-ChildItem `
              $documents `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $documentsBackup `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Document skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Logs
          # --------------------------------------------------------

          $logsBackup =
            "$env:BACKUP\Logs"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $logsBackup |
            Out-Null

          if (Test-Path $env:LOGDIR) {

            Get-ChildItem `
              $env:LOGDIR `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $logsBackup `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "Backup preparation completed."

      # ============================================================
      # 14. UPLOAD BACKUP
      # ============================================================

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup\
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 15. UPLOAD LOGS
      # ============================================================

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-Logs\
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 16. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Stopping applications..."

          Stop-Process `
            -Name "filezilla" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "geany" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "AnyDesk" `
            -Force `
            -ErrorAction SilentlyContinue

          $vnc =
            "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc =
              "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (Test-Path $vnc) {

            & $vnc -stop -silent 2>$null
          }

          Write-Host "Cleanup completed."
