name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dao-desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      DAO_WORKSPACE: D:\DAO-Workspace
      DAO_LOGS: D:\DAO-Logs
      DAO_RUNTIME_MINUTES: "225"

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Prepare directories
      # ------------------------------------------------------------
      - name: Prepare DAO directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "D:\DAO-Workspace" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\DAO-Logs" | Out-Null

          Write-Host "DAO directories prepared."
          Write-Host "Workspace: D:\DAO-Workspace"
          Write-Host "Logs:      D:\DAO-Logs"

      # ------------------------------------------------------------
      # Restore latest backup
      # ------------------------------------------------------------
      - name: Restore latest DAO backup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\restore.ps1"

      # ------------------------------------------------------------
      # Install and start desktop
      # ------------------------------------------------------------
      - name: Start DAO Windows Desktop
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\desktop.ps1" `
            -RuntimeMinutes ([int]$env:DAO_RUNTIME_MINUTES)

      # ------------------------------------------------------------
      # Backup
      # ------------------------------------------------------------
      - name: Create DAO backup
        if: always()
        shell: powershell
        run: |
          Write-Host "Creating final DAO backup..."

          try {
            & "$env:GITHUB_WORKSPACE\scripts\backup.ps1"
          }
          catch {
            Write-Warning "Backup script failed: $($_.Exception.Message)"
          }

      # ------------------------------------------------------------
      # Upload backup
      # ------------------------------------------------------------
      - name: Upload DAO backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Logs\dao-windows-backup.zip
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      # ------------------------------------------------------------
      # Upload logs
      # ------------------------------------------------------------
      - name: Upload DAO logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: |
            D:\DAO-Logs\**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ------------------------------------------------------------
      # Final dashboard
      # ------------------------------------------------------------
      - name: Final DAO dashboard
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          $info = "D:\DAO-Logs\connection-info.txt"

          if (Test-Path $info) {
            Get-Content $info
          }
          else {
            Write-Host "connection-info.txt was not created."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Artifacts:"
          Write-Host "  dao-windows-backup"
          Write-Host "  dao-windows-logs"
          Write-Host "=============================================="
