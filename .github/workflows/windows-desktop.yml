name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO-Workspace
  DAO_LOGS: D:\DAO-Logs
  DAO_TOOLS: D:\DAO-Tools
  DAO_BACKUP: D:\DAO-Backup
  DAO_RESTORE: D:\DAO-Restore

  DAO_BACKUP_NAME: dao-windows-backup
  DAO_LOGS_NAME: dao-windows-logs

  DAO_RUNTIME_SECONDS: 13500

  VNC_PORT: 5900
  NOVNC_PORT: 6080

jobs:

  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      # ============================================================
      # 2. INITIALIZE
      # ============================================================

      - name: Initialize DAO environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dirs = @(
            $env:DAO_ROOT
            $env:DAO_LOGS
            $env:DAO_TOOLS
            $env:DAO_BACKUP
            $env:DAO_RESTORE
          )

          foreach ($dir in $dirs) {
            New-Item `
              -ItemType Directory `
              -Path $dir `
              -Force `
              | Out-Null
          }

          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Runner      : $env:RUNNER_NAME"
          Write-Host "OS          : $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace   : $env:DAO_ROOT"
          Write-Host "Logs        : $env:DAO_LOGS"
          Write-Host "Tools       : $env:DAO_TOOLS"
          Write-Host ""

      # ============================================================
      # 3. VALIDATE SECRETS
      # ============================================================

      - name: Validate secrets
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "GitHub Secret VNC_PASSWORD is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "GitHub Secret ANYDESK_PASSWORD is missing."
          }

          Write-Host "[OK] VNC_PASSWORD configured."
          Write-Host "[OK] ANYDESK_PASSWORD configured."

      # ============================================================
      # 4. TOOLING
      # ============================================================

      - name: Check runner tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "winget:"
          try {
            winget --version
          }
          catch {
            Write-Warning "winget unavailable."
          }

          Write-Host ""
          Write-Host "Python:"
          try {
            python --version
          }
          catch {
            Write-Warning "Python unavailable."
          }

          Write-Host ""
          Write-Host "Git:"
          try {
            git --version
          }
          catch {
            Write-Warning "Git unavailable."
          }

      # ============================================================
      # 5. FIND PREVIOUS BACKUP
      # ============================================================

      - name: Find latest valid DAO backup
        id: find_backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Continue'

          $found = $false
          $runId = ''

          try {

            $runsJson = gh run list `
              --repo $env:REPOSITORY `
              --workflow windows-desktop.yml `
              --status completed `
              --limit 50 `
              --json databaseId,conclusion,createdAt

            if (-not [string]::IsNullOrWhiteSpace($runsJson)) {

              $runs = @(
                $runsJson |
                  ConvertFrom-Json
              )

              foreach ($run in $runs) {

                if ([string]$run.databaseId -eq [string]$env:CURRENT_RUN_ID) {
                  continue
                }

                if ($run.conclusion -ne 'success') {
                  continue
                }

                try {

                  $apiPath =
                    "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                  $artifactJson = gh api `
                    -H "Accept: application/vnd.github+json" `
                    $apiPath

                  if ([string]::IsNullOrWhiteSpace($artifactJson)) {
                    continue
                  }

                  $response = $artifactJson | ConvertFrom-Json

                  $candidate = @(
                    $response.artifacts |
                      Where-Object {
                        $_.name -eq $env:DAO_BACKUP_NAME -and
                        $_.expired -eq $false
                      }
                  ) |
                    Select-Object -First 1

                  if ($null -ne $candidate) {

                    $found = $true
                    $runId = [string]$run.databaseId

                    Write-Host "[OK] Previous backup found."
                    Write-Host "Run ID: $runId"

                    break
                  }
                }
                catch {
                  Write-Warning `
                    "Could not inspect run $($run.databaseId): $($_.Exception.Message)"
                }
              }
            }
          }
          catch {
            Write-Warning `
              "Backup discovery failed: $($_.Exception.Message)"
          }

          if (-not $found) {
            Write-Host "[INFO] No previous backup available."
          }

          "found=$($found.ToString().ToLowerInvariant())" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "run_id=$runId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      # ============================================================
      # 6. DOWNLOAD PREVIOUS BACKUP
      # ============================================================

      - name: Download previous DAO backup
        if: steps.find_backup.outputs.found == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ steps.find_backup.outputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:DAO_RESTORE) {
            Remove-Item `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force `
            | Out-Null

          Write-Host "Downloading previous DAO backup..."

          gh run download `
            $env:BACKUP_RUN_ID `
            --repo $env:REPOSITORY `
            --name $env:DAO_BACKUP_NAME `
            --dir $env:DAO_RESTORE

          if ($LASTEXITCODE -ne 0) {
            throw "Backup artifact download failed."
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
            throw "Downloaded backup contains no files."
          }

          Write-Host "[OK] Previous backup downloaded."
          Write-Host "Files: $($files.Count)"

      # ============================================================
      # 7. RESTORE
      # ============================================================

      - name: Restore DAO state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=============================================="
          Write-Host "             DAO RESTORE"
          Write-Host "=============================================="

          $restoreFiles = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($restoreFiles.Count -eq 0) {
            Write-Host "[INFO] No previous DAO state to restore."
            exit 0
          }

          $stateZip = @(
            $restoreFiles |
              Where-Object {
                $_.Name -eq 'dao-state.zip'
              }
          ) |
            Select-Object -First 1

          if ($null -eq $stateZip) {
            Write-Host "[INFO] No dao-state.zip found."
            exit 0
          }

          $tempRestore = Join-Path `
            $env:DAO_TOOLS `
            "restore-temp"

          if (Test-Path -LiteralPath $tempRestore) {
            Remove-Item `
              -LiteralPath $tempRestore `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $tempRestore `
            -Force `
            | Out-Null

          try {

            Expand-Archive `
              -LiteralPath $stateZip.FullName `
              -DestinationPath $tempRestore `
              -Force

            $items = Get-ChildItem `
              -LiteralPath $tempRestore `
              -Force `
              -ErrorAction SilentlyContinue

            foreach ($item in $items) {

              $destination = Join-Path `
                $env:DAO_ROOT `
                $item.Name

              if (Test-Path -LiteralPath $destination) {
                Remove-Item `
                  -LiteralPath $destination `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue
              }

              Move-Item `
                -LiteralPath $item.FullName `
                -Destination $destination `
                -Force
            }

            Write-Host "[OK] DAO state restored."

          }
          catch {

            Write-Warning `
              "Restore failed: $($_.Exception.Message)"
          }

      # ============================================================
      # 8. INSTALL APPLICATIONS
      # ============================================================

      - name: Install DAO applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          function Install-Winget {
            param(
              [string]$Id,
              [string]$Name,
              [switch]$Optional
            )

            Write-Host ""
            Write-Host "Checking $Name..."

            try {

              winget list `
                --id $Id `
                --exact `
                --accept-source-agreements `
                --disable-interactivity `
                2>$null | Out-Null

              if ($LASTEXITCODE -eq 0) {
                Write-Host "[OK] $Name already installed."
                return $true
              }
            }
            catch {
            }

            try {

              Write-Host "Installing $Name..."

              winget install `
                --id $Id `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -eq 0) {
                Write-Host "[OK] $Name installed."
                return $true
              }

              Write-Warning `
                "$Name installation returned $LASTEXITCODE."
            }
            catch {

              Write-Warning `
                "Could not install $Name : $($_.Exception.Message)"
            }

            if ($Optional) {
              return $false
            }

            return $false
          }

          $wingetAvailable = $false

          try {
            winget --version | Out-Null
            $wingetAvailable = ($LASTEXITCODE -eq 0)
          }
          catch {
          }

          if (-not $wingetAvailable) {
            Write-Warning "winget unavailable."
            exit 0
          }

          Install-Winget `
            -Id "FileZilla.FileZilla" `
            -Name "FileZilla" `
            -Optional | Out-Null

          Install-Winget `
            -Id "Geany.Geany" `
            -Name "Geany" `
            -Optional | Out-Null

          Install-Winget `
            -Id "GlavSoft.TightVNC" `
            -Name "TightVNC" | Out-Null

          Install-Winget `
            -Id "AnyDeskSoftwareGmbH.AnyDesk" `
            -Name "AnyDesk" `
            -Optional | Out-Null

          Install-Winget `
            -Id "Cloudflare.cloudflared" `
            -Name "Cloudflare cloudflared" | Out-Null

      # ============================================================
      # 9. DOWNLOAD / PREPARE NOVNC
      # ============================================================

      - name: Prepare noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $noVncDir = Join-Path `
            $env:DAO_ROOT `
            "Applications\noVNC"

          New-Item `
            -ItemType Directory `
            -Path (Split-Path $noVncDir -Parent) `
            -Force `
            | Out-Null

          $vncHtml = Join-Path `
            $noVncDir `
            "vnc.html"

          if (Test-Path -LiteralPath $vncHtml) {

            Write-Host "[OK] noVNC already exists."
            exit 0
          }

          $zip = Join-Path `
            $env:DAO_TOOLS `
            "novnc.zip"

          $extract = Join-Path `
            $env:DAO_TOOLS `
            "novnc-extract"

          if (Test-Path -LiteralPath $zip) {
            Remove-Item `
              -LiteralPath $zip `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (Test-Path -LiteralPath $extract) {
            Remove-Item `
              -LiteralPath $extract `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Downloading noVNC..."

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $extract `
            -Force

          $source = Join-Path `
            $extract `
            "noVNC-1.7.0"

          if (-not (Test-Path -LiteralPath $source)) {
            throw "noVNC archive directory was not found."
          }

          if (Test-Path -LiteralPath $noVncDir) {
            Remove-Item `
              -LiteralPath $noVncDir `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Move-Item `
            -LiteralPath $source `
            -Destination $noVncDir `
            -Force

          if (-not (Test-Path -LiteralPath $vncHtml)) {
            throw "noVNC vnc.html was not found."
          }

          Write-Host "[OK] noVNC ready."

      # ============================================================
      # 10. START DESKTOP
      # ============================================================

      - name: Start DAO desktop
        id: start_desktop
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Workspace = $env:DAO_ROOT
          $Logs = $env:DAO_LOGS
          $Tools = $env:DAO_TOOLS

          $VncPort = [int]$env:VNC_PORT
          $WebPort = [int]$env:NOVNC_PORT

          $NoVncDir = Join-Path `
            $Workspace `
            "Applications\noVNC"

          $TunnelUrlFile = Join-Path `
            $Logs `
            "tunnel-url.txt"

          $NoVncUrlFile = Join-Path `
            $Logs `
            "novnc-url.txt"

          $AnyDeskIdFile = Join-Path `
            $Logs `
            "anydesk-id.txt"

          $VncLog = Join-Path `
            $Logs `
            "vnc.log"

          $WebLog = Join-Path `
            $Logs `
            "websockify.log"

          $WebErrorLog = Join-Path `
            $Logs `
            "websockify-error.log"

          $CloudLog = Join-Path `
            $Logs `
            "cloudflared.log"

          $CloudErrLog = Join-Path `
            $Logs `
            "cloudflared-error.log"

          $AnyDeskLog = Join-Path `
            $Logs `
            "anydesk.log"

          $Connection = Join-Path `
            $Logs `
            "connection-info.txt"

          function Find-Executable {
            param(
              [string[]]$Names,
              [string[]]$Paths = @()
            )

            foreach ($name in $Names) {

              try {

                $cmd = Get-Command `
                  $name `
                  -ErrorAction SilentlyContinue

                if ($cmd) {
                  return $cmd.Source
                }
              }
              catch {
              }
            }

            foreach ($path in $Paths) {

              try {

                if (Test-Path -LiteralPath $path) {
                  return $path
                }
              }
              catch {
              }
            }

            return $null
          }

          function Test-Port {
            param(
              [int]$Port,
              [int]$TimeoutMs = 1000
            )

            $client = $null

            try {

              $client = [System.Net.Sockets.TcpClient]::new()

              $async = $client.BeginConnect(
                "127.0.0.1",
                $Port,
                $null,
                $null
              )

              if (-not $async.AsyncWaitHandle.WaitOne($TimeoutMs)) {
                return $false
              }

              $client.EndConnect($async)

              return $true
            }
            catch {
              return $false
            }
            finally {

              if ($null -ne $client) {

                try {
                  $client.Close()
                }
                catch {
                }
              }
            }
          }

          function Stop-ProcessNames {
            param(
              [string[]]$Names
            )

            foreach ($name in $Names) {

              try {

                $processes = Get-Process `
                  -Name $name `
                  -ErrorAction SilentlyContinue

                foreach ($process in $processes) {

                  Write-Host `
                    "Stopping $name PID=$($process.Id)"

                  Stop-Process `
                    -Id $process.Id `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
              }
              catch {
              }
            }
          }

          function Wait-Port {
            param(
              [int]$Port,
              [int]$Seconds = 30
            )

            $deadline = (Get-Date).AddSeconds($Seconds)

            while ((Get-Date) -lt $deadline) {

              if (Test-Port -Port $Port) {
                return $true
              }

              Start-Sleep -Seconds 1
            }

            return $false
          }

          Write-Host "=============================================="
          Write-Host "       STARTING DAO WINDOWS DESKTOP"
          Write-Host "=============================================="

          New-Item `
            -ItemType Directory `
            -Path $Workspace,$Logs,$Tools `
            -Force `
            | Out-Null

          # ----------------------------------------------------------
          # Find executables
          # ----------------------------------------------------------

          $tightVnc = Find-Executable `
            -Names @(
              "tvnserver.exe",
              "winvnc.exe"
            ) `
            -Paths @(
              "$env:ProgramFiles\TightVNC\tvnserver.exe",
              "$env:ProgramFiles\TightVNC\winvnc.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\winvnc.exe"
            )

          $anydesk = Find-Executable `
            -Names @(
              "AnyDesk.exe",
              "anydesk.exe"
            ) `
            -Paths @(
              "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
              "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
            )

          $cloudflared = Find-Executable `
            -Names @(
              "cloudflared.exe"
            ) `
            -Paths @(
              "$env:ProgramFiles\cloudflared\cloudflared.exe",
              "${env:ProgramFiles(x86)}\cloudflared\cloudflared.exe"
            )

          $python = Find-Executable `
            -Names @(
              "python.exe",
              "py.exe"
            )

          Write-Host "TightVNC   : $(if ($tightVnc) { $tightVnc } else { 'NOT FOUND' })"
          Write-Host "AnyDesk    : $(if ($anydesk) { $anydesk } else { 'NOT FOUND' })"
          Write-Host "cloudflared: $(if ($cloudflared) { $cloudflared } else { 'NOT FOUND' })"
          Write-Host "Python     : $(if ($python) { $python } else { 'NOT FOUND' })"

          # ----------------------------------------------------------
          # Stop stale services
          # ----------------------------------------------------------

          Stop-ProcessNames @(
            "websockify",
            "cloudflared"
          )

          # ----------------------------------------------------------
          # TightVNC
          # ----------------------------------------------------------

          if (-not $tightVnc) {
            throw "TightVNC executable not found."
          }

          $regPath = "HKLM:\SOFTWARE\TightVNC\Server"

          New-Item `
            -Path $regPath `
            -Force `
            -ErrorAction SilentlyContinue `
            | Out-Null

          $password8 = $env:VNC_PASSWORD

          if ($password8.Length -gt 8) {
            $password8 = $password8.Substring(0,8)
          }

          while ($password8.Length -lt 8) {
            $password8 += [char]0
          }

          try {

            $key = [byte[]](
              0x17,
              0x52,
              0x6B,
              0x8E,
              0x17,
              0x52,
              0x6B,
              0x8E
            )

            $plain = [System.Text.Encoding]::ASCII.GetBytes(
              $password8
            )

            $des = [System.Security.Cryptography.DES]::Create()

            try {

              $des.Mode =
                [System.Security.Cryptography.CipherMode]::ECB

              $des.Padding =
                [System.Security.Cryptography.PaddingMode]::None

              $des.Key = $key

              $encrypted =
                $des.CreateEncryptor().TransformFinalBlock(
                  $plain,
                  0,
                  8
                )
            }
            finally {
              $des.Dispose()
            }

            New-ItemProperty `
              -Path $regPath `
              -Name "Password" `
              -PropertyType Binary `
              -Value $encrypted `
              -Force `
              | Out-Null

            New-ItemProperty `
              -Path $regPath `
              -Name "UseVncAuthentication" `
              -PropertyType DWord `
              -Value 1 `
              -Force `
              | Out-Null

            New-ItemProperty `
              -Path $regPath `
              -Name "RfbPort" `
              -PropertyType DWord `
              -Value $VncPort `
              -Force `
              | Out-Null

            New-ItemProperty `
              -Path $regPath `
              -Name "LoopbackOnly" `
              -PropertyType DWord `
              -Value 0 `
              -Force `
              | Out-Null

            Write-Host "[OK] TightVNC configuration written."
          }
          catch {

            Write-Warning `
              "TightVNC configuration failed: $($_.Exception.Message)"
          }

          try {
            & $tightVnc `
              -stop `
              -silent `
              2>&1 |
              Out-File `
                -FilePath $VncLog `
                -Append
          }
          catch {
          }

          Start-Sleep -Seconds 2

          try {

            & $tightVnc `
              -start `
              -silent `
              2>&1 |
              Out-File `
                -FilePath $VncLog `
                -Append
          }
          catch {

            throw `
              "TightVNC start failed: $($_.Exception.Message)"
          }

          if (-not (Wait-Port -Port $VncPort -Seconds 30)) {
            throw "TightVNC did not listen on TCP 5900."
          }

          Write-Host "[OK] TCP 5900 listening."

          # ----------------------------------------------------------
          # AnyDesk
          # ----------------------------------------------------------

          $AnyDeskStatus = "UNAVAILABLE"
          $AnyDeskId = ""

          if ($anydesk) {

            try {

              & $anydesk `
                --start `
                2>&1 |
                Out-File `
                  -FilePath $AnyDeskLog `
                  -Append
            }
            catch {
            }

            Start-Sleep -Seconds 5

            if (
              -not [string]::IsNullOrWhiteSpace(
                $env:ANYDESK_PASSWORD
              )
            ) {

              try {

                $psi =
                  [System.Diagnostics.ProcessStartInfo]::new()

                $psi.FileName = $anydesk
                $psi.Arguments = "--set-password"
                $psi.UseShellExecute = $false
                $psi.RedirectStandardInput = $true
                $psi.RedirectStandardOutput = $true
                $psi.RedirectStandardError = $true
                $psi.CreateNoWindow = $true

                $process =
                  [System.Diagnostics.Process]::new()

                $process.StartInfo = $psi

                [void]$process.Start()

                $process.StandardInput.WriteLine(
                  $env:ANYDESK_PASSWORD
                )

                $process.StandardInput.Close()

                $stdout =
                  $process.StandardOutput.ReadToEnd()

                $stderr =
                  $process.StandardError.ReadToEnd()

                $process.WaitForExit()

                if ($process.ExitCode -eq 0) {

                  Write-Host `
                    "[OK] AnyDesk password configuration completed."
                }
                else {

                  Write-Warning `
                    "AnyDesk password command returned $($process.ExitCode)."
                }

                if (-not [string]::IsNullOrWhiteSpace($stdout)) {
                  Add-Content `
                    -Path $AnyDeskLog `
                    -Value $stdout
                }

                if (-not [string]::IsNullOrWhiteSpace($stderr)) {
                  Add-Content `
                    -Path $AnyDeskLog `
                    -Value $stderr
                }
              }
              catch {

                Write-Warning `
                  "AnyDesk password setup failed: $($_.Exception.Message)"
              }
            }

            try {

              $idOutput =
                & $anydesk `
                  --get-id `
                  2>&1

              $idText =
                ($idOutput | Out-String)

              $match =
                [regex]::Match(
                  $idText,
                  "\b\d{6,12}\b"
                )

              if ($match.Success) {
                $AnyDeskId = $match.Value
              }
            }
            catch {
            }

            if ($AnyDeskId) {

              Set-Content `
                -LiteralPath $AnyDeskIdFile `
                -Value $AnyDeskId `
                -NoNewline

              $AnyDeskStatus = "RUNNING"

              Write-Host "[OK] AnyDesk ID detected."
            }
            else {

              $AnyDeskStatus = "ID NOT DETECTED"

              Write-Warning `
                "AnyDesk ID was not detected."
            }
          }

          # ----------------------------------------------------------
          # Python / websockify
          # ----------------------------------------------------------

          if (-not $python) {
            throw "Python is required for websockify."
          }

          Write-Host "Installing/updating websockify..."

          & $python `
            -m pip `
            install `
            --disable-pip-version-check `
            --no-input `
            --upgrade `
            websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $websockify = Find-Executable `
            -Names @(
              "websockify.exe",
              "websockify"
            )

          if (-not $websockify) {

            try {

              $scriptsPath =
                & $python `
                  -c `
                  "import sysconfig; print(sysconfig.get_path('scripts'))"

              if ($scriptsPath) {

                $candidate =
                  Join-Path `
                    ([string]$scriptsPath).Trim() `
                    "websockify.exe"

                if (Test-Path -LiteralPath $candidate) {
                  $websockify = $candidate
                }
              }
            }
            catch {
            }
          }

          if (-not $websockify) {
            throw "websockify executable not found."
          }

          Write-Host "websockify: $websockify"

          # ----------------------------------------------------------
          # Start websockify
          # ----------------------------------------------------------

          if (Test-Port -Port $WebPort) {

            Stop-ProcessNames @(
              "websockify"
            )

            Start-Sleep -Seconds 2
          }

          $webArgs = @(
            "--web",
            $NoVncDir,
            "$WebPort",
            "127.0.0.1:$VncPort"
          )

          Start-Process `
            -FilePath $websockify `
            -ArgumentList $webArgs `
            -WorkingDirectory $NoVncDir `
            -RedirectStandardOutput $WebLog `
            -RedirectStandardError $WebErrorLog `
            -WindowStyle Hidden `
            | Out-Null

          if (-not (Wait-Port -Port $WebPort -Seconds 30)) {

            if (Test-Path -LiteralPath $WebErrorLog) {

              Write-Host "----- websockify error -----"

              Get-Content `
                -LiteralPath $WebErrorLog `
                -Tail 100
            }

            throw "websockify did not listen on TCP 6080."
          }

          Write-Host "[OK] TCP 6080 listening."

          # ----------------------------------------------------------
          # Cloudflare Quick Tunnel
          # ----------------------------------------------------------

          if (-not $cloudflared) {
            throw "cloudflared executable not found."
          }

          Remove-Item `
            -LiteralPath $TunnelUrlFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $NoVncUrlFile `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-ProcessNames @(
            "cloudflared"
          )

          Start-Sleep -Seconds 2

          $cloudProcess =
            Start-Process `
              -FilePath $cloudflared `
              -ArgumentList @(
                "tunnel",
                "--no-autoupdate",
                "--url",
                "http://127.0.0.1:$WebPort"
              ) `
              -RedirectStandardOutput
