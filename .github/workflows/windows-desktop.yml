name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      WORKSPACE: D:\DAO-Workspace
      BACKUP: D:\DAO-Backup
      LOGDIR: D:\DAO-Logs
      NOVNC_DIR: D:\DAO-noVNC

    steps:

      # ============================================================
      # 1. PREPARE
      # ============================================================

      - name: Prepare environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:WORKSPACE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:BACKUP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LOGDIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NOVNC_DIR | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host "Workspace : $env:WORKSPACE"
          Write-Host "Backup    : $env:BACKUP"
          Write-Host "Logs      : $env:LOGDIR"
          Write-Host "=============================================="

      # ============================================================
      # 2. FIND PREVIOUS BACKUP
      # ============================================================

      - name: Find previous backup
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=dao-windows-backup&per_page=100"

          try {
            $response = Invoke-RestMethod `
              -Uri $url `
              -Headers $headers `
              -Method Get

            $artifact = $response.artifacts |
              Where-Object { $_.expired -eq $false } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {

              Write-Host "Previous backup found."
              Write-Host "Artifact ID: $($artifact.id)"

              "artifact_id=$($artifact.id)" |
                Out-File $env:GITHUB_OUTPUT -Append
            }
            else {

              Write-Host "No previous backup found."

              "artifact_id=" |
                Out-File $env:GITHUB_OUTPUT -Append
            }
          }
          catch {

            Write-Warning "Artifact lookup failed."
            Write-Warning $_

            "artifact_id=" |
              Out-File $env:GITHUB_OUTPUT -Append
          }

      # ============================================================
      # 3. RESTORE BACKUP
      # ============================================================

      - name: Restore previous backup
        if: steps.previous.outputs.artifact_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactId = "${{ steps.previous.outputs.artifact_id }}"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $zip = "$env:TEMP\dao-backup.zip"

          Write-Host "Downloading previous backup..."

          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" `
            -Headers $headers `
            -OutFile $zip

          Write-Host "Extracting..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $env:BACKUP `
            -Force

          # Workspace
          if (Test-Path "$env:BACKUP\workspace") {

            Get-ChildItem `
              "$env:BACKUP\workspace" `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $env:WORKSPACE `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          # FileZilla
          if (Test-Path "$env:BACKUP\FileZilla") {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:APPDATA\FileZilla" |
              Out-Null

            Get-ChildItem `
              "$env:BACKUP\FileZilla" `
              -Force |
            Copy-Item `
              -Destination "$env:APPDATA\FileZilla" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # Geany
          if (Test-Path "$env:BACKUP\Geany") {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:APPDATA\geany" |
              Out-Null

            Get-ChildItem `
              "$env:BACKUP\Geany" `
              -Force |
            Copy-Item `
              -Destination "$env:APPDATA\geany" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Restore completed."

      # ============================================================
      # 4. INSTALL FILEZILLA + GEANY
      # ============================================================

      - name: Install FileZilla and Geany
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing FileZilla..."

          winget install `
            --id FileZilla.FileZilla `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "Installing Geany..."

          winget install `
            --id Geany.Geany `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "Applications installed."

      # ============================================================
      # 5. INSTALL TIGHTVNC
      # ============================================================

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "VNC_PASSWORD Secret is missing."
          }

          if ($env:VNC_PASSWORD.Length -lt 6) {
            throw "VNC_PASSWORD must contain at least 6 characters."
          }

          Write-Host "Downloading TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.88/tightvnc-2.8.88-gpl-setup-64bit.msi" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "TightVNC download failed."
          }

          Write-Host "Installing TightVNC..."

          $args = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server,Viewer"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
            "SET_USECONTROLAUTHENTICATION=1"
            "VALUE_OF_USECONTROLAUTHENTICATION=1"
            "SET_CONTROLPASSWORD=1"
            "VALUE_OF_CONTROLPASSWORD=$env:VNC_PASSWORD"
          )

          Start-Process `
            msiexec.exe `
            -ArgumentList $args `
            -Wait

          Write-Host "TightVNC installed and configured."

      # ============================================================
      # 6. START VNC
      # ============================================================

      - name: Start TightVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vnc = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc = "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (!(Test-Path $vnc)) {
            throw "TightVNC server executable not found."
          }

          Write-Host "Starting TightVNC..."

          & $vnc -start -silent

          Start-Sleep -Seconds 5

          Get-Service |
            Where-Object {
              $_.Name -match "tvn|tight"
            } |
            Format-Table -AutoSize

          Write-Host "VNC is running on TCP 5900."

      # ============================================================
      # 7. INSTALL ANYDESK
      # ============================================================

      - name: Install AnyDesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD Secret is missing."
          }

          Write-Host "Downloading AnyDesk..."

          $installer = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer `
            -UseBasicParsing

          Write-Host "Installing AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win --silent' `
            -Wait

          Start-Sleep -Seconds 8

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk executable not found."
          }

          Start-Process `
            -FilePath $anydesk

          Start-Sleep -Seconds 8

          # Unattended Access
          $env:ANYDESK_PASSWORD |
            & $anydesk --set-password _unattended_access

          Start-Sleep -Seconds 3

          Write-Host "AnyDesk configured."

      # ============================================================
      # 8. GET ANYDESK ID
      # ============================================================

      - name: Get AnyDesk ID
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (Test-Path $anydesk) {

            Start-Sleep -Seconds 5

            $id = & $anydesk --get-id 2>$null |
              Out-String

            $id = $id.Trim()

            Set-Content `
              "$env:LOGDIR\anydesk-id.txt" `
              $id

            Write-Host ""
            Write-Host "AnyDesk ID: $id"
          }

      # ============================================================
      # 9. INSTALL PYTHON PACKAGES FOR NOVNC
      # ============================================================

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath "$env:TEMP\novnc" `
            -Force

          $source =
            Get-ChildItem "$env:TEMP\novnc" -Directory |
            Select-Object -First 1

          if (!$source) {
            throw "noVNC extraction failed."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:NOVNC_DIR |
            Out-Null

          Copy-Item `
            "$($source.FullName)\*" `
            $env:NOVNC_DIR `
            -Recurse `
            -Force

          Write-Host "Installing websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify

          Write-Host "noVNC and websockify installed."

      # ============================================================
      # 10. START NOVNC
      # ============================================================

      - name: Start noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $novnc = "$env:NOVNC_DIR"

          if (!(Test-Path "$novnc\vnc.html")) {
            throw "noVNC vnc.html not found."
          }

          Write-Host "Starting noVNC..."

          $process = Start-Process `
            -FilePath "python" `
            -ArgumentList @(
              "-m"
              "websockify"
              "--web=$novnc"
              "6080"
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput "$env:LOGDIR\websockify.log" `
            -RedirectStandardError "$env:LOGDIR\websockify-error.log" `
            -PassThru

          Set-Content `
            "$env:LOGDIR\websockify.pid" `
            $process.Id

          Start-Sleep -Seconds 5

          $check = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$check) {
            Write-Host "websockify did not report a listening socket yet."
          }
          else {
            Write-Host "noVNC is listening on TCP 6080."
          }

      # ============================================================
      # 11. INSTALL CLOUDFLARED
      # ============================================================

      - name: Install Cloudflare Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading cloudflared..."

          $cloudflared = "$env:TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {
            throw "cloudflared download failed."
          }

          $target = "$env:WORKSPACE\cloudflared.exe"

          Copy-Item `
            $cloudflared `
            $target `
            -Force

          Write-Host "cloudflared installed."

      # ============================================================
      # 12. START CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Start public noVNC tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $cloudflared =
            "$env:WORKSPACE\cloudflared.exe"

          $log =
            "$env:LOGDIR\cloudflared.log"

          Write-Host "Starting Cloudflare Quick Tunnel..."

          $process = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel"
              "--url"
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $log `
            -RedirectStandardError "$env:LOGDIR\cloudflared-error.log" `
            -PassThru

          Set-Content `
            "$env:LOGDIR\cloudflared.pid" `
            $process.Id

          # Wait for URL
          $url = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            if (Test-Path $log) {

              $text =
                Get-Content $log -Raw -ErrorAction SilentlyContinue

              $match =
                [regex]::Match(
                  $text,
                  'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                )

              if ($match.Success) {

                $url = $match.Value
                break
              }
            }
          }

          if (!$url) {

            Write-Host ""
            Write-Host "Cloudflare output:"
            Get-Content $log -ErrorAction SilentlyContinue

            throw "Cloudflare Quick Tunnel URL was not detected."
          }

          $novncURL =
            "$url/vnc.html?autoconnect=true&resize=remote"

          Set-Content `
            "$env:LOGDIR\novnc-url.txt" `
            $novncURL

          Set-Content `
            "$env:LOGDIR\tunnel-url.txt" `
            $url

          Write-Host ""
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              DAO WEB VNC"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "VNC:"
          Write-Host "TCP 5900"
          Write-Host ""
          Write-Host "noVNC:"
          Write-Host "TCP 6080"
          Write-Host ""
          Write-Host "WEB URL:"
          Write-Host $novncURL
          Write-Host ""
          Write-Host "Password:"
          Write-Host "Use VNC_PASSWORD Secret"
          Write-Host ""
          Write-Host "=============================================="

      # ============================================================
      # 13. FINAL CONNECTION INFORMATION
      # ============================================================

      - name: Show final connection information
        shell: pwsh
        run: |
          $anydesk = "Unavailable"
          $web = "Unavailable"

          if (Test-Path "$env:LOGDIR\anydesk-id.txt") {
            $anydesk =
              Get-Content "$env:LOGDIR\anydesk-id.txt"
          }

          if (Test-Path "$env:LOGDIR\novnc-url.txt") {
            $web =
              Get-Content "$env:LOGDIR\novnc-url.txt"
          }

          $info = @"
          ==============================================
                  DAO WINDOWS DESKTOP
          ==============================================

          Windows:
          Windows 2025 Runner

          Applications:
          - FileZilla
          - Geany
          - AnyDesk
          - TightVNC
          - noVNC

          Workspace:
          $env:WORKSPACE

          ----------------------------------------------

          ANYDESK
          ID:
          $anydesk

          ----------------------------------------------

          DAO WEB VNC

          VNC:
          TCP 5900

          noVNC:
          TCP 6080

          WEB URL:
          $web

          Password:
          Use VNC_PASSWORD Secret

          ----------------------------------------------

          Runtime:
          4 hours maximum

          Backup:
          Enabled

          Restore:
          Enabled

          ==============================================
          "@

          Set-Content `
            "$env:LOGDIR\connection-info.txt" `
            $info

          Write-Host $info

      # ============================================================
      # 14. KEEP DESKTOP ALIVE
      # ============================================================

      - name: Keep desktop alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DAO WINDOWS DESKTOP IS RUNNING"
          Write-Host " Maximum runtime: 4 HOURS"
          Write-Host "=============================================="
          Write-Host ""

          for ($minute = 1; $minute -le 235; $minute++) {

            $time =
              Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host `
              "[$time] Desktop active: $minute / 235 minutes"

            Start-Sleep -Seconds 60
          }

          Write-Host "Runtime limit reached."

      # ============================================================
      # 15. BACKUP
      # ============================================================

      - name: Prepare backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Preparing backup..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:BACKUP |
            Out-Null

          # --------------------------------------------------------
          # Workspace
          # --------------------------------------------------------

          $workspaceBackup =
            "$env:BACKUP\workspace"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $workspaceBackup |
            Out-Null

          if (Test-Path $env:WORKSPACE) {

            Get-ChildItem `
              $env:WORKSPACE `
              -Force `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ne "cloudflared.exe"
            } |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $workspaceBackup `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop
              }
              catch {

                Write-Warning `
                  "Workspace item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # FileZilla
          # --------------------------------------------------------

          $fz =
            "$env:APPDATA\FileZilla"

          if (Test-Path $fz) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:BACKUP\FileZilla" |
              Out-Null

            Get-ChildItem `
              $fz `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination "$env:BACKUP\FileZilla" `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop
              }
              catch {

                Write-Warning `
                  "FileZilla item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Geany
          # --------------------------------------------------------

          $geany =
            "$env:APPDATA\geany"

          if (Test-Path $geany) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:BACKUP\Geany" |
              Out-Null

            Get-ChildItem `
              $geany `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination "$env:BACKUP\Geany" `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop
              }
              catch {

                Write-Warning `
                  "Geany item skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Documents - only accessible files
          # --------------------------------------------------------

          $documents =
            [Environment]::GetFolderPath("MyDocuments")

          $docBackup =
            "$env:BACKUP\Documents"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $docBackup |
            Out-Null

          if (Test-Path $documents) {

            Get-ChildItem `
              $documents `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $docBackup `
                  -Force `
                  -ErrorAction Stop
              }
              catch {

                Write-Warning `
                  "Document skipped: $($_.FullName)"
              }
            }
          }

          # --------------------------------------------------------
          # Logs
          # --------------------------------------------------------

          $logsBackup =
            "$env:BACKUP\Logs"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $logsBackup |
            Out-Null

          if (Test-Path $env:LOGDIR) {

            Get-ChildItem `
              $env:LOGDIR `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $logsBackup `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Backup completed."

      # ============================================================
      # 16. UPLOAD BACKUP
      # ============================================================

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup\
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 17. UPLOAD LOGS
      # ============================================================

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-Logs\
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 18. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Cleaning up..."

          Stop-Process `
            -Name "filezilla" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "geany" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "AnyDesk" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "cloudflared" `
            -Force `
            -ErrorAction SilentlyContinue

          Stop-Process `
            -Name "python" `
            -Force `
            -ErrorAction SilentlyContinue

          $vnc =
            "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc =
              "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (Test-Path $vnc) {
            & $vnc -stop -silent 2>$null
          }

          Write-Host "Cleanup completed."
