name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: DAO Windows Desktop
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      WORKSPACE: D:\DAO-Workspace
      BACKUP: D:\DAO-Backup
      LOGDIR: D:\DAO-Logs
      NOVNC_DIR: D:\DAO-noVNC

    steps:

      # ============================================================
      # 1. PREPARE
      # ============================================================

      - name: Prepare environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:WORKSPACE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:BACKUP | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LOGDIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NOVNC_DIR | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host "Windows: Windows 2025 Runner"
          Write-Host "Workspace: $env:WORKSPACE"
          Write-Host "Backup: $env:BACKUP"
          Write-Host "Logs: $env:LOGDIR"
          Write-Host "=============================================="

      # ============================================================
      # 2. FIND PREVIOUS BACKUP
      # ============================================================

      - name: Find previous backup
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"

          try {

            $response = Invoke-RestMethod `
              -Uri $url `
              -Headers $headers `
              -Method Get

            $artifact = $response.artifacts |
              Where-Object {
                $_.name -eq "dao-windows-backup" -and
                $_.expired -eq $false
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {

              Write-Host "Previous backup found."
              Write-Host "Artifact ID: $($artifact.id)"

              "artifact_id=$($artifact.id)" |
                Out-File $env:GITHUB_OUTPUT -Append
            }
            else {

              Write-Host "No previous backup found."

              "artifact_id=" |
                Out-File $env:GITHUB_OUTPUT -Append
            }

          }
          catch {

            Write-Warning "Could not find previous backup."
            Write-Warning $_

            "artifact_id=" |
              Out-File $env:GITHUB_OUTPUT -Append
          }

      # ============================================================
      # 3. RESTORE
      # ============================================================

      - name: Restore previous backup
        if: steps.previous.outputs.artifact_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $artifactId = "${{ steps.previous.outputs.artifact_id }}"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $zip = "$env:TEMP\dao-backup.zip"

          Write-Host "Downloading backup..."

          try {

            Invoke-WebRequest `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" `
              -Headers $headers `
              -OutFile $zip `
              -UseBasicParsing

          }
          catch {

            Write-Warning "Backup download failed."
            Write-Warning $_
            exit 0
          }

          if (!(Test-Path $zip)) {
            Write-Warning "Backup ZIP not found."
            exit 0
          }

          $extract = "$env:TEMP\dao-restore"

          Remove-Item `
            $extract `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extract |
            Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          # Workspace
          if (Test-Path "$extract\workspace") {

            Get-ChildItem `
              "$extract\workspace" `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $env:WORKSPACE `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          # FileZilla
          if (Test-Path "$extract\FileZilla") {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:APPDATA\FileZilla" |
              Out-Null

            Get-ChildItem `
              "$extract\FileZilla" `
              -Force |
            ForEach-Object {

              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination "$env:APPDATA\FileZilla" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          # Geany
          if (Test-Path "$extract\Geany") {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:APPDATA\geany" |
              Out-Null

            Get-ChildItem `
              "$extract\Geany" `
              -Force |
            ForEach-Object {

              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination "$env:APPDATA\geany" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Restore completed."

      # ============================================================
      # 4. INSTALL APPLICATIONS
      # ============================================================

      - name: Install FileZilla and Geany
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing FileZilla..."

          winget install `
            --id FileZilla.FileZilla `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "Installing Geany..."

          winget install `
            --id Geany.Geany `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "FileZilla and Geany ready."

      # ============================================================
      # 5. INSTALL TIGHTVNC
      # ============================================================

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "VNC_PASSWORD Secret is missing."
          }

          if ($env:VNC_PASSWORD.Length -lt 6) {
            throw "VNC_PASSWORD must be at least 6 characters."
          }

          Write-Host "Downloading TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.88/tightvnc-2.8.88-gpl-setup-64bit.msi" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "TightVNC download failed."
          }

          Write-Host "Installing TightVNC..."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server,Viewer"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          )

          $install = Start-Process `
            msiexec.exe `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MSI Exit Code: $($install.ExitCode)"

          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
            throw "TightVNC installation failed."
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 6. START TIGHTVNC
      # ============================================================

      - name: Start TightVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $vnc = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc = "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (!(Test-Path $vnc)) {
            throw "TightVNC server not found."
          }

          Write-Host "Starting TightVNC..."

          & $vnc -start -silent

          Start-Sleep -Seconds 5

          $port = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($port) {
            Write-Host "TightVNC is listening on TCP 5900."
          }
          else {
            Write-Warning "TCP 5900 is not detected yet."
          }

      # ============================================================
      # 7. INSTALL ANYDESK
      # ============================================================

      - name: Install AnyDesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD Secret is missing."
          }

          Write-Host "Downloading AnyDesk..."

          $installer = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "AnyDesk download failed."
          }

          Write-Host "Installing AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win --silent' `
            -Wait

          Start-Sleep -Seconds 8

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk executable not found."
          }

          Start-Process `
            -FilePath $anydesk

          Start-Sleep -Seconds 8

          Write-Host "Configuring AnyDesk..."

          $env:ANYDESK_PASSWORD |
            & $anydesk --set-password _unattended_access

          Start-Sleep -Seconds 3

          Write-Host "AnyDesk ready."

      # ============================================================
      # 8. ANYDESK ID
      # ============================================================

      - name: Get AnyDesk ID
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            $anydesk = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (!(Test-Path $anydesk)) {
            Write-Warning "AnyDesk executable not found."
            exit 0
          }

          Start-Sleep -Seconds 5

          $id = & $anydesk --get-id 2>$null |
            Out-String

          $id = $id.Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            $id = "Unavailable"
          }

          Set-Content `
            "$env:LOGDIR\anydesk-id.txt" `
            $id

          Write-Host ""
          Write-Host "AnyDesk ID:"
          Write-Host $id

      # ============================================================
      # 9. DOWNLOAD NOVNC
      # ============================================================

      - name: Install noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading noVNC..."

          $zip = "$env:TEMP\novnc.zip"
          $extract = "$env:TEMP\novnc-extract"

          Remove-Item `
            $extract `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            throw "noVNC download failed."
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $source =
            Get-ChildItem `
              $extract `
              -Directory `
              -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$source) {
            throw "noVNC extraction failed."
          }

          Remove-Item `
            $env:NOVNC_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:NOVNC_DIR |
            Out-Null

          Copy-Item `
            "$($source.FullName)\*" `
            $env:NOVNC_DIR `
            -Recurse `
            -Force

          if (!(Test-Path "$env:NOVNC_DIR\vnc.html")) {
            throw "vnc.html not found."
          }

          Write-Host "noVNC ready."

      # ============================================================
      # 10. INSTALL WEBSOCKIFY
      # ============================================================

      - name: Install websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install websockify

          python -m websockify --help | Out-Null

          Write-Host "websockify installed."

      # ============================================================
      # 11. START NOVNC
      # ============================================================

      - name: Start noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "$env:LOGDIR\websockify.log" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:LOGDIR\websockify-error.log" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Starting noVNC..."

          $process = Start-Process `
            -FilePath "python" `
            -ArgumentList @(
              "-m"
              "websockify"
              "--web=$env:NOVNC_DIR"
              "--heartbeat=30"
              "6080"
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput "$env:LOGDIR\websockify.log" `
            -RedirectStandardError "$env:LOGDIR\websockify-error.log" `
            -PassThru

          Set-Content `
            "$env:LOGDIR\websockify.pid" `
            $process.Id

          Write-Host "websockify PID: $($process.Id)"

          Start-Sleep -Seconds 5

      # ============================================================
      # 12. VERIFY NOVNC
      # ============================================================

      - name: Verify noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking noVNC..."

          $connection = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$connection) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host " noVNC FAILED"
            Write-Host "=============================================="

            Write-Host ""
            Write-Host "websockify stdout:"

            if (Test-Path "$env:LOGDIR\websockify.log") {
              Get-Content `
                "$env:LOGDIR\websockify.log" `
                -ErrorAction SilentlyContinue
            }

            Write-Host ""
            Write-Host "websockify stderr:"

            if (Test-Path "$env:LOGDIR\websockify-error.log") {
              Get-Content `
                "$env:LOGDIR\websockify-error.log" `
                -ErrorAction SilentlyContinue
            }

            throw "noVNC is not listening on TCP 6080."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " noVNC OK"
          Write-Host " TCP 6080 LISTENING"
          Write-Host "=============================================="

      # ============================================================
      # 13. CLOUDFLARED
      # ============================================================

      - name: Install Cloudflare Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared =
            "$env:WORKSPACE\cloudflared.exe"

          Write-Host "Downloading cloudflared..."

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {
            throw "cloudflared download failed."
          }

          Write-Host "cloudflared ready."

      # ============================================================
      # 14. START CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Start public noVNC tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared =
            "$env:WORKSPACE\cloudflared.exe"

          $log =
            "$env:LOGDIR\cloudflared.log"

          $errorLog =
            "$env:LOGDIR\cloudflared-error.log"

          Remove-Item `
            $log `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $errorLog `
            -Force `
            -ErrorAction SilentlyContinue

          Get-Process `
            cloudflared `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Starting Cloudflare Quick Tunnel"
          Write-Host " Target: http://127.0.0.1:6080"
          Write-Host "=============================================="
          Write-Host ""

          $process = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel"
              "--url"
              "http://127.0.0.1:6080"
              "--no-autoupdate"
            ) `
            -RedirectStandardOutput $log `
            -RedirectStandardError $errorLog `
            -PassThru

          Set-Content `
            "$env:LOGDIR\cloudflared.pid" `
            $process.Id

          Write-Host "Cloudflare PID: $($process.Id)"

          $url = $null

          # --------------------------------------------------------
          # Wait up to 120 seconds
          # --------------------------------------------------------

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            $text = ""

            if (Test-Path $log) {

              try {

                $stdout =
                  Get-Content `
                    $log `
                    -Raw `
                    -ErrorAction SilentlyContinue

                if ($null -ne $stdout) {
                  $text += "`n$stdout"
                }

              }
              catch {}
            }

            if (Test-Path $errorLog) {

              try {

                $stderr =
                  Get-Content `
                    $errorLog `
                    -Raw `
                    -ErrorAction SilentlyContinue

                if ($null -ne $stderr) {
                  $text += "`n$stderr"
                }

              }
              catch {}
            }

            if ([string]::IsNullOrWhiteSpace($text)) {

              Write-Host "[$i/60] Waiting for Cloudflare..."
              continue
            }

            $match = [regex]::Match(
              $text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {

              $url =
                $match.Value

              Write-Host "Tunnel URL detected."

              break
            }

            Write-Host "[$i/60] Tunnel starting..."
          }

          # --------------------------------------------------------
          # FAILURE
          # --------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($url)) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host " CLOUDFLARE TUNNEL FAILED"
            Write-Host "=============================================="

            Write-Host ""
            Write-Host "Cloudflare STDOUT:"

            if (Test-Path $log) {
              Get-Content `
                $log `
                -ErrorAction SilentlyContinue
            }
            else {
              Write-Host "(empty)"
            }

            Write-Host ""
            Write-Host "Cloudflare STDERR:"

            if (Test-Path $errorLog) {
              Get-Content `
                $errorLog `
                -ErrorAction SilentlyContinue
            }
            else {
              Write-Host "(empty)"
            }

            if ($process.HasExited) {
              Write-Host ""
              Write-Host "Process exited."
              Write-Host "Exit code: $($process.ExitCode)"
            }

            throw "Cloudflare Quick Tunnel URL was not detected."
          }

          # --------------------------------------------------------
          # SUCCESS
          # --------------------------------------------------------

          $novncURL =
            "$url/vnc.html?autoconnect=true&resize=remote"

          Set-Content `
            "$env:LOGDIR\tunnel-url.txt" `
            $url

          Set-Content `
            "$env:LOGDIR\novnc-url.txt" `
            $novncURL

          Write-Host ""
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              DAO WEB VNC"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "VNC:"
          Write-Host "TCP 5900"
          Write-Host ""
          Write-Host "noVNC:"
          Write-Host "TCP 6080"
          Write-Host ""
          Write-Host "WEB URL:"
          Write-Host ""
          Write-Host $novncURL
          Write-Host ""
          Write-Host "Password:"
          Write-Host "Use VNC_PASSWORD Secret"
          Write-Host ""
          Write-Host "=============================================="

      # ============================================================
      # 15. FINAL INFORMATION
      # ============================================================

      - name: Show connection information
        shell: pwsh
        run: |
          $anydesk = "Unavailable"
          $web = "Unavailable"

          if (Test-Path "$env:LOGDIR\anydesk-id.txt") {
            $anydesk =
              Get-Content `
                "$env:LOGDIR\anydesk-id.txt" `
                -Raw
          }

          if (Test-Path "$env:LOGDIR\novnc-url.txt") {
            $web =
              Get-Content `
                "$env:LOGDIR\novnc-url.txt" `
                -Raw
          }

          $info = @"
          ==============================================
                  DAO WINDOWS DESKTOP
          ==============================================

          Windows:
          Windows 2025 Runner

          Applications:
          - FileZilla
          - Geany
          - AnyDesk
          - TightVNC
          - noVNC

          Workspace:
          $env:WORKSPACE

          ==============================================

          ANYDESK ID:
          $anydesk

          ==============================================

          DAO WEB VNC

          VNC:
          TCP 5900

          noVNC:
          TCP 6080

          WEB URL:
          $web

          Password:
          Use VNC_PASSWORD Secret

          ==============================================

          Runtime:
          4 hours maximum

          Backup:
          Enabled

          Restore:
          Enabled

          ==============================================
          "@

          Set-Content `
            "$env:LOGDIR\connection-info.txt" `
            $info

          Write-Host $info

      # ============================================================
      # 16. KEEP ALIVE
      # ============================================================

      - name: Keep desktop alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "DAO WINDOWS DESKTOP IS RUNNING"
          Write-Host "Maximum runtime: 4 hours"
          Write-Host ""

          for ($minute = 1; $minute -le 235; $minute++) {

            $time =
              Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host `
              "[$time] Desktop active: $minute / 235 minutes"

            Start-Sleep -Seconds 60
          }

          Write-Host "Runtime limit reached."

      # ============================================================
      # 17. BACKUP
      # ============================================================

      - name: Prepare backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Preparing backup..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:BACKUP |
            Out-Null

          # Workspace
          $workspaceBackup =
            "$env:BACKUP\workspace"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $workspaceBackup |
            Out-Null

          if (Test-Path $env:WORKSPACE) {

            Get-ChildItem `
              $env:WORKSPACE `
              -Force `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ne "cloudflared.exe"
            } |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $workspaceBackup `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Workspace item skipped: $($_.FullName)"
              }
            }
          }

          # FileZilla
          $fz =
            "$env:APPDATA\FileZilla"

          if (Test-Path $fz) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:BACKUP\FileZilla" |
              Out-Null

            Get-ChildItem `
              $fz `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination "$env:BACKUP\FileZilla" `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "FileZilla item skipped: $($_.FullName)"
              }
            }
          }

          # Geany
          $geany =
            "$env:APPDATA\geany"

          if (Test-Path $geany) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:BACKUP\Geany" |
              Out-Null

            Get-ChildItem `
              $geany `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination "$env:BACKUP\Geany" `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Geany item skipped: $($_.FullName)"
              }
            }
          }

          # Documents
          $documents =
            [Environment]::GetFolderPath("MyDocuments")

          $docBackup =
            "$env:BACKUP\Documents"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $docBackup |
            Out-Null

          if (Test-Path $documents) {

            Get-ChildItem `
              $documents `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              try {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $docBackup `
                  -Force `
                  -ErrorAction Stop

              }
              catch {

                Write-Warning `
                  "Document skipped: $($_.FullName)"
              }
            }
          }

          # Logs
          if (Test-Path $env:LOGDIR) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:BACKUP\Logs" |
              Out-Null

            Get-ChildItem `
              $env:LOGDIR `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination "$env:BACKUP\Logs" `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Backup completed."

      # ============================================================
      # 18. UPLOAD BACKUP
      # ============================================================

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup\
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 19. UPLOAD LOGS
      # ============================================================

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-Logs\
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 20. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Cleaning up..."

          Get-Process filezilla `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Get-Process geany `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Get-Process AnyDesk `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Get-Process cloudflared `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Get-Process python `
            -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          $vnc =
            "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            $vnc =
              "C:\Program Files (x86)\TightVNC\tvnserver.exe"
          }

          if (Test-Path $vnc) {
            & $vnc -stop -silent 2>$null
          }

          Write-Host "Cleanup completed."
