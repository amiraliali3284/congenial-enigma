name: DAO Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dao-windows-desktop
  cancel-in-progress: false

env:
  DAO_ROOT: D:\DAO-Workspace
  DAO_LOGS: D:\DAO-Logs
  DAO_TOOLS: D:\DAO-Tools
  DAO_BACKUP: D:\DAO-Backup
  DAO_RESTORE: D:\DAO-Restore
  DAO_SCRIPTS: ${{ github.workspace }}\scripts

  DAO_BACKUP_NAME: dao-windows-backup
  DAO_LOGS_NAME: dao-windows-logs

  DAO_MAX_RUNTIME_SECONDS: 13500

jobs:

  desktop:

    name: DAO Windows Desktop

    runs-on: windows-2025

    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      # ========================================================
      # 2. INITIALIZE
      # ========================================================

      - name: Initialize DAO environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $directories = @(
            $env:DAO_ROOT,
            $env:DAO_LOGS,
            $env:DAO_TOOLS,
            $env:DAO_BACKUP,
            $env:DAO_RESTORE
          )

          foreach ($directory in $directories) {
            New-Item `
              -ItemType Directory `
              -Path $directory `
              -Force |
              Out-Null
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Runner      : $env:RUNNER_NAME"
          Write-Host "OS          : $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host ""
          Write-Host "Workspace   : $env:DAO_ROOT"
          Write-Host "Logs        : $env:DAO_LOGS"
          Write-Host "Tools       : $env:DAO_TOOLS"
          Write-Host "Backup      : $env:DAO_BACKUP"
          Write-Host "Restore     : $env:DAO_RESTORE"

      # ========================================================
      # 3. VALIDATE SCRIPTS
      # ========================================================

      - name: Validate DAO scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'desktop.ps1',
            'restore.ps1',
            'backup.ps1'
          )

          foreach ($name in $required) {

            $path = Join-Path `
              $env:DAO_SCRIPTS `
              $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required script not found: $path"
            }

            Write-Host "[OK] $name"
          }

      # ========================================================
      # 4. VALIDATE SECRETS
      # ========================================================

      - name: Validate required secrets
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "GitHub Secret VNC_PASSWORD is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "GitHub Secret ANYDESK_PASSWORD is missing."
          }

          Write-Host "[OK] VNC_PASSWORD is configured."
          Write-Host "[OK] ANYDESK_PASSWORD is configured."

      # ========================================================
      # 5. TOOLING
      # ========================================================

      - name: Check runner tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "GitHub CLI:"
          try {
            gh --version |
              Select-Object -First 1
          }
          catch {
            Write-Warning "GitHub CLI unavailable."
          }

          Write-Host ""
          Write-Host "winget:"
          try {
            winget --version
          }
          catch {
            Write-Warning "winget unavailable."
          }

          Write-Host ""
          Write-Host "Python:"
          try {
            python --version
          }
          catch {
            Write-Warning "Python unavailable."
          }

      # ========================================================
      # 6. FIND PREVIOUS BACKUP
      # ========================================================

      - name: Find latest DAO backup
        id: find_backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Continue'

          $found = $false
          $runId = ''

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       SEARCHING FOR DAO BACKUP"
          Write-Host "=============================================="

          try {

            $runsJson = gh run list `
              --repo $env:REPOSITORY `
              --workflow windows-desktop.yml `
              --status completed `
              --limit 50 `
              --json databaseId,status,conclusion,createdAt

            if (-not [string]::IsNullOrWhiteSpace($runsJson)) {

              $runs = @(
                $runsJson |
                  ConvertFrom-Json
              )

              foreach ($run in $runs) {

                if (
                  [string]$run.databaseId `
                    -eq [string]$env:CURRENT_RUN_ID
                ) {
                  continue
                }

                if ($run.conclusion -ne 'success') {
                  continue
                }

                try {

                  $apiPath = `
                    "/repos/$env:REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100"

                  $artifactJson = gh api `
                    -H "Accept: application/vnd.github+json" `
                    $apiPath

                  if ([string]::IsNullOrWhiteSpace($artifactJson)) {
                    continue
                  }

                  $artifactResponse = `
                    $artifactJson |
                    ConvertFrom-Json

                  $candidate = @(
                    $artifactResponse.artifacts |
                      Where-Object {
                        $_.name -eq $env:DAO_BACKUP_NAME -and
                        $_.expired -eq $false
                      }
                  ) |
                  Select-Object -First 1

                  if ($null -ne $candidate) {

                    $found = $true
                    $runId = [string]$run.databaseId

                    Write-Host "[OK] Backup found."
                    Write-Host "Run ID: $runId"
                    Write-Host "Artifact ID: $($candidate.id)"
                    Write-Host "Created: $($run.createdAt)"

                    break
                  }
                }
                catch {

                  Write-Warning `
                    "Could not inspect run $($run.databaseId): $($_.Exception.Message)"
                }
              }
            }
          }
          catch {

            Write-Warning `
              "Backup discovery failed: $($_.Exception.Message)"
          }

          if (-not $found) {
            Write-Host "[INFO] No valid previous backup found."
          }

          "found=$($found.ToString().ToLowerInvariant())" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "run_id=$runId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      # ========================================================
      # 7. DOWNLOAD BACKUP
      # ========================================================

      - name: Download previous DAO backup
        if: steps.find_backup.outputs.found == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ steps.find_backup.outputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:DAO_RESTORE) {

            Remove-Item `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_RESTORE `
            -Force |
            Out-Null

          gh run download `
            $env:BACKUP_RUN_ID `
            --repo $env:REPOSITORY `
            --name $env:DAO_BACKUP_NAME `
            --dir $env:DAO_RESTORE

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub backup artifact download failed."
          }

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:DAO_RESTORE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
            throw "Downloaded backup contains no files."
          }

          Write-Host "[OK] Backup downloaded."
          Write-Host "Files: $($files.Count)"

      # ========================================================
      # 8. RESTORE
      # ========================================================

      - name: Restore DAO data
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $restoreScript = Join-Path `
            $env:DAO_SCRIPTS `
            'restore.ps1'

          if (-not (Test-Path -LiteralPath $restoreScript)) {
            Write-Warning "restore.ps1 not found."
            exit 0
          }

          try {

            & $restoreScript `
              -RestoreRoot $env:DAO_RESTORE `
              -WorkspaceRoot $env:DAO_ROOT `
              -LogsRoot $env:DAO_LOGS

            $code = $LASTEXITCODE

            if ($code -eq 0) {
              Write-Host "[OK] Restore completed."
            }
            else {
              Write-Warning `
                "Restore returned exit code $code."
            }
          }
          catch {

            Write-Warning `
              "Restore warning: $($_.Exception.Message)"
          }

      # ========================================================
      # 9. START DESKTOP
      # ========================================================

      - name: Start DAO desktop
        id: start_desktop
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $desktopScript = Join-Path `
            $env:DAO_SCRIPTS `
            'desktop.ps1'

          if (-not (Test-Path -LiteralPath $desktopScript)) {
            throw "desktop.ps1 not found."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       STARTING DAO WINDOWS DESKTOP"
          Write-Host "=============================================="

          & $desktopScript `
            -WorkspaceRoot $env:DAO_ROOT `
            -LogsRoot $env:DAO_LOGS `
            -ToolsRoot $env:DAO_TOOLS `
            -VncPassword $env:VNC_PASSWORD `
            -AnyDeskPassword $env:ANYDESK_PASSWORD

          if ($LASTEXITCODE -ne 0) {
            throw "desktop.ps1 returned exit code $LASTEXITCODE."
          }

      # ========================================================
      # 10. DASHBOARD
      # ========================================================

      - name: Display DAO connection dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $infoFile = Join-Path `
            $env:DAO_LOGS `
            'connection-info.txt'

          $urlFile = Join-Path `
            $env:DAO_LOGS `
            'novnc-url.txt'

          $idFile = Join-Path `
            $env:DAO_LOGS `
            'anydesk-id.txt'

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host $env:DAO_ROOT
          Write-Host ""

          Write-Host "VNC TCP: 5900"
          Write-Host "noVNC TCP: 6080"
          Write-Host ""

          if (Test-Path -LiteralPath $idFile) {

            $id = Get-Content `
              -LiteralPath $idFile `
              -Raw `
              -ErrorAction SilentlyContinue

            if ($id) {
              Write-Host "AnyDesk:"
              Write-Host "ID: $($id.Trim())"
              Write-Host ""
            }
          }

          if (Test-Path -LiteralPath $urlFile) {

            $url = Get-Content `
              -LiteralPath $urlFile `
              -Raw `
              -ErrorAction SilentlyContinue

            if ($url) {
              Write-Host "WEB URL:"
              Write-Host $url.Trim()
              Write-Host ""
            }
          }

          if (Test-Path -LiteralPath $infoFile) {

            Write-Host "Connection information:"
            Write-Host "----------------------------------------------"

            Get-Content `
              -LiteralPath $infoFile `
              -ErrorAction SilentlyContinue
          }

      # ========================================================
      # 11. KEEP ALIVE
      # ========================================================

      - name: Keep DAO desktop alive
        id: keepalive
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'

          $maximumSeconds = [int]$env:DAO_MAX_RUNTIME_SECONDS

          $started = Get-Date
          $deadline = $started.AddSeconds($maximumSeconds)

          $lastSupervisor = Get-Date
          $supervisorIntervalSeconds = 60

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          DAO DESKTOP ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Maximum runtime: 03:45:00"
          Write-Host "Workflow limit:  04:00:00"

          while ((Get-Date) -lt $deadline) {

            $now = Get-Date

            $elapsedSeconds = [int](
              ($now - $started).TotalSeconds
            )

            $remainingSeconds =
              [math]::Max(
                0,
                $maximumSeconds - $elapsedSeconds
              )

            $eh = [math]::Floor($elapsedSeconds / 3600)
            $em = [math]::Floor(
              ($elapsedSeconds % 3600) / 60
            )
            $es = $elapsedSeconds % 60

            $rh = [math]::Floor($remainingSeconds / 3600)
            $rm = [math]::Floor(
              ($remainingSeconds % 3600) / 60
            )
            $rs = $remainingSeconds % 60

            $elapsedText = '{0:D2}:{1:D2}:{2:D2}' -f `
              $eh, $em, $es

            $remainingText = '{0:D2}:{1:D2}:{2:D2}' -f `
              $rh, $rm, $rs

            Write-Host ""
            Write-Host "DAO Desktop active"
            Write-Host "Runtime:   $elapsedText / 03:45:00"
            Write-Host "Remaining: $remainingText"

            foreach ($port in @(5900, 6080)) {

              try {

                $listener = Get-NetTCPConnection `
                  -LocalPort $port `
                  -State Listen `
                  -ErrorAction SilentlyContinue

                if ($listener) {
                  Write-Host "[OK] TCP $port LISTENING"
                }
                else {
                  Write-Warning `
                    "[WARN] TCP $port is NOT listening."
                }
              }
              catch {
                Write-Warning `
                  "Could not inspect TCP $port."
              }
            }

            if (
              ((Get-Date) - $lastSupervisor).TotalSeconds `
                -ge $supervisorIntervalSeconds
            ) {

              $desktopScript = Join-Path `
                $env:DAO_SCRIPTS `
                'desktop.ps1'

              if (Test-Path -LiteralPath $desktopScript) {

                try {

                  & $desktopScript `
                    -WorkspaceRoot $env:DAO_ROOT `
                    -LogsRoot $env:DAO_LOGS `
                    -ToolsRoot $env:DAO_TOOLS `
                    -VncPassword $env:VNC_PASSWORD `
                    -AnyDeskPassword $env:ANYDESK_PASSWORD `
                    -SupervisorOnly

                  if ($LASTEXITCODE -ne 0) {

                    Write-Warning `
                      "Supervisor returned exit code $LASTEXITCODE."
                  }
                }
                catch {

                  Write-Warning `
                    "Supervisor check failed: $($_.Exception.Message)"
                }
              }

              $lastSupervisor = Get-Date
            }

            Start-Sleep -Seconds 15
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       DESKTOP RUNTIME COMPLETE"
          Write-Host "=============================================="

      # ========================================================
      # 12. STOP SERVICES
      # ========================================================

      - name: Stop DAO services
        if: always()
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'

          $desktopScript = Join-Path `
            $env:DAO_SCRIPTS `
            'desktop.ps1'

          if (-not (Test-Path -LiteralPath $desktopScript)) {
            Write-Warning "desktop.ps1 unavailable."
            exit 0
          }

          try {

            & $desktopScript `
              -WorkspaceRoot $env:DAO_ROOT `
              -LogsRoot $env:DAO_LOGS `
              -ToolsRoot $env:DAO_TOOLS `
              -VncPassword $env:VNC_PASSWORD `
              -AnyDeskPassword $env:ANYDESK_PASSWORD `
              -StopServices

            if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Service cleanup returned exit code $LASTEXITCODE."
            }
          }
          catch {

            Write-Warning `
              "Service cleanup warning: $($_.Exception.Message)"
          }

      # ========================================================
      # 13. BACKUP
      # ========================================================

      - name: Create DAO backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $backupScript = Join-Path `
            $env:DAO_SCRIPTS `
            'backup.ps1'

          if (-not (Test-Path -LiteralPath $backupScript)) {
            Write-Error "backup.ps1 not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_BACKUP `
            -Force |
            Out-Null

          try {

            & $backupScript `
              -WorkspaceRoot $env:DAO_ROOT `
              -LogsRoot $env:DAO_LOGS `
              -BackupRoot $env:DAO_BACKUP

            $code = $LASTEXITCODE

            if ($code -eq 0) {
              Write-Host "[OK] Backup completed."
            }
            else {
              Write-Warning `
                "Backup returned exit code $code."
            }
          }
          catch {

            Write-Warning `
              "Backup exception: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "Backup contents:"

          Get-ChildItem `
            -LiteralPath $env:DAO_BACKUP `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ========================================================
      # 14. UPLOAD BACKUP
      # ========================================================

      - name: Upload DAO backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-backup
          path: D:\DAO-Backup
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # ========================================================
      # 15. PREPARE LOG SUMMARY
      # ========================================================

      - name: Prepare DAO logs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          New-Item `
            -ItemType Directory `
            -Path $env:DAO_LOGS `
            -Force |
            Out-Null

          $summaryFile = Join-Path `
            $env:DAO_LOGS `
            'workflow-summary.txt'

          $summary = @"
DAO WINDOWS DESKTOP
===================

Repository:
$env:GITHUB_REPOSITORY

Run ID:
$env:GITHUB_RUN_ID

Workflow:
$env:GITHUB_WORKFLOW

Runner:
$env:RUNNER_NAME

Workspace:
$env:DAO_ROOT

Logs:
$env:DAO_LOGS

Backup:
$env:DAO_BACKUP

Runtime:
03:45:00 desktop
04:00:00 hard job limit

Generated:
$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')

IMPORTANT:
Passwords and GitHub tokens are not stored in this summary.
"@

          Set-Content `
            -LiteralPath $summaryFile `
            -Value $summary `
            -Encoding UTF8

      # ========================================================
      # 16. UPLOAD LOGS
      # ========================================================

      - name: Upload DAO logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-windows-logs
          path: D:\DAO-Logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ========================================================
      # 17. FINAL DASHBOARD
      # ========================================================

      - name: Final DAO dashboard
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $urlFile = Join-Path `
            $env:DAO_LOGS `
            'novnc-url.txt'

          $idFile = Join-Path `
            $env:DAO_LOGS `
            'anydesk-id.txt'

          $infoFile = Join-Path `
            $env:DAO_LOGS `
            'connection-info.txt'

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DAO WINDOWS DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Workspace:"
          Write-Host $env:DAO_ROOT
          Write-Host ""

          Write-Host "VNC TCP: 5900"
          Write-Host "noVNC TCP: 6080"
          Write-Host ""

          if (Test-Path -LiteralPath $idFile) {

            $id = Get-Content `
              -LiteralPath $idFile `
              -Raw `
              -ErrorAction SilentlyContinue

            if ($id) {
              Write-Host "AnyDesk ID:"
              Write-Host $id.Trim()
              Write-Host ""
            }
          }

          if (Test-Path -LiteralPath $urlFile) {

            $url = Get-Content `
              -LiteralPath $urlFile `
              -Raw `
              -ErrorAction SilentlyContinue

            if ($url) {
              Write-Host "PUBLIC noVNC URL:"
              Write-Host $url.Trim()
              Write-Host ""
            }
          }

          if (Test-Path -LiteralPath $infoFile) {

            Write-Host "Connection information:"
            Write-Host "----------------------------------------------"

            Get-Content `
              -LiteralPath $infoFile `
              -ErrorAction SilentlyContinue

            Write-Host ""
          }

          Write-Host "Backup artifact:"
          Write-Host "dao-windows-backup"
          Write-Host ""

          Write-Host "Logs artifact:"
          Write-Host "dao-windows-logs"
          Write-Host ""

          Write-Host "Maximum desktop runtime:"
          Write-Host "03:45:00"
          Write-Host ""

          Write-Host "Hard workflow timeout:"
          Write-Host "04:00:00"
          Write-Host ""

          Write-Host "Passwords and tokens are not displayed."

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             DAO DESKTOP END"
          Write-Host "=============================================="
