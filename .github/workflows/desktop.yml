name: DAO Web Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: DAO Desktop - 4 Hours
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # =====================================================
      # Basic setup
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p "$HOME/dao-workspace"
          mkdir -p "$HOME/dao-logs"

      # =====================================================
      # Restore workspace from previous run
      # =====================================================

      - name: Find previous workspace artifact
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Searching for previous workspace..."

          ARTIFACT_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=dao-workspace&per_page=20" \
            --jq '.artifacts
              | map(select(.expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found artifact: $ARTIFACT_ID"
            echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "No previous workspace found."
            echo "artifact_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore previous workspace
        if: steps.previous.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading previous workspace..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.previous.outputs.artifact_id }}/zip" \
            > /tmp/dao-workspace.zip

          unzip -o /tmp/dao-workspace.zip \
            -d "$HOME/dao-workspace"

          echo "Workspace restored."

      # =====================================================
      # Install desktop
      # =====================================================

      - name: Install desktop environment
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            dbus-user-session \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify \
            filezilla \
            geany \
            wget \
            curl \
            unzip \
            jq

      # =====================================================
      # Install AnyDesk
      # =====================================================

      - name: Install AnyDesk
        continue-on-error: true
        run: |
          echo "Installing AnyDesk..."

          wget -q \
            https://download.anydesk.com/linux/anydesk_8.0.4-1_amd64.deb \
            -O /tmp/anydesk.deb

          if [ -s /tmp/anydesk.deb ]; then
            sudo apt-get install -y /tmp/anydesk.deb || true
          fi

          if command -v anydesk >/dev/null 2>&1; then
            echo "AnyDesk installed."
            anydesk --version || true
          else
            echo "AnyDesk installation unavailable."
          fi

      # =====================================================
      # Configure VNC
      # =====================================================

      - name: Configure TigerVNC
        run: |
          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export DISPLAY=:1
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          # Start lightweight XFCE
          startxfce4 &

          sleep 8

          # Only requested applications
          filezilla &
          geany &

          # AnyDesk is optional
          if command -v anydesk >/dev/null 2>&1; then
              anydesk &
          fi

          wait
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      # =====================================================
      # Start VNC
      # =====================================================

      - name: Start VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost no

          sleep 5

          vncserver -list

      # =====================================================
      # Start noVNC
      # =====================================================

      - name: Start noVNC
        run: |
          nohup websockify \
            --web=/usr/share/novnc/ \
            8080 \
            127.0.0.1:5901 \
            > "$HOME/dao-logs/novnc.log" 2>&1 &

          echo $! > "$HOME/dao-logs/novnc.pid"

          sleep 5

          if ! pgrep -f "websockify.*8080" >/dev/null; then
            echo "noVNC failed."
            cat "$HOME/dao-logs/novnc.log"
            exit 1
          fi

          echo "noVNC is running."

      # =====================================================
      # Cloudflare Quick Tunnel
      # =====================================================

      - name: Install cloudflared
        run: |
          echo "Installing cloudflared..."

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version

      - name: Start public tunnel
        run: |
          echo "Starting Cloudflare tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > "$HOME/dao-logs/cloudflared.log" 2>&1 &

          echo $! > "$HOME/dao-logs/cloudflared.pid"

          echo "Waiting for public URL..."

          for i in $(seq 1 30); do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$HOME/dao-logs/cloudflared.log" \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            echo "Could not obtain Cloudflare URL."
            cat "$HOME/dao-logs/cloudflared.log"
            exit 1
          fi

          echo "===================================================="
          echo "             DAO WEB DESKTOP ONLINE"
          echo "===================================================="
          echo
          echo "PUBLIC DESKTOP:"
          echo
          echo "${URL}/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "===================================================="
          echo
          echo "Applications:"
          echo "  FileZilla"
          echo "  Geany"
          echo "  AnyDesk (if available)"
          echo
          echo "The URL is temporary and will stop when this"
          echo "GitHub Actions runner stops."
          echo
          echo "===================================================="

          echo "DESKTOP_URL=${URL}/vnc.html?autoconnect=true&resize=remote" >> "$GITHUB_ENV"

      # =====================================================
      # Save connection information
      # =====================================================

      - name: Save connection info
        run: |
          cat > "$HOME/dao-logs/desktop-info.txt" <<EOF
          DAO WEB DESKTOP

          URL:
          ${DESKTOP_URL}

          VNC:
          :1

          VNC PORT:
          5901

          noVNC:
          8080

          Applications:
          FileZilla
          Geany
          AnyDesk
          EOF

          cat "$HOME/dao-logs/desktop-info.txt"

      # =====================================================
      # Keep desktop alive for 4 hours
      # =====================================================

      - name: Keep desktop alive
        run: |
          echo "Desktop is running."

          for MINUTE in $(seq 1 240); do

            if ! pgrep -f "Xtigervnc" >/dev/null; then
              echo "TigerVNC stopped unexpectedly."
              exit 1
            fi

            if ! pgrep -f "websockify.*8080" >/dev/null; then
              echo "noVNC stopped unexpectedly."
              exit 1
            fi

            echo "[$(date '+%H:%M:%S')] Desktop active: ${MINUTE}/240 minutes"

            sleep 60
          done

          echo "4 hours completed."

      # =====================================================
      # Save workspace
      # =====================================================

      - name: Save workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-workspace
          path: |
            ${{ env.HOME }}/dao-workspace/
          retention-days: 30
          if-no-files-found: ignore

      # =====================================================
      # Save logs
      # =====================================================

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-desktop-logs
          path: |
            ${{ env.HOME }}/dao-logs/
            ${{ env.HOME }}/.vnc/
          retention-days: 7
          if-no-files-found: ignore

      # =====================================================
      # Shutdown
      # =====================================================

      - name: Shutdown desktop
        if: always()
        run: |
          echo "Stopping desktop..."

          if [ -f "$HOME/dao-logs/cloudflared.pid" ]; then
            kill "$(cat "$HOME/dao-logs/cloudflared.pid")" 2>/dev/null || true
          fi

          if [ -f "$HOME/dao-logs/novnc.pid" ]; then
            kill "$(cat "$HOME/dao-logs/novnc.pid")" 2>/dev/null || true
          fi

          vncserver -kill :1 2>/dev/null || true

          pkill -9 Xtigervnc 2>/dev/null || true
          pkill -9 websockify 2>/dev/null || true
          pkill -9 filezilla 2>/dev/null || true
          pkill -9 geany 2>/dev/null || true
          pkill -9 anydesk 2>/dev/null || true

          echo "Desktop stopped."
