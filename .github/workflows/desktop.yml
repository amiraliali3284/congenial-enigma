name: DAO Web Desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: DAO Desktop - 4 Hours
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      WORKSPACE: /home/runner/dao-workspace
      LOGDIR: /home/runner/dao-logs
      VNCDIR: /home/runner/.vnc

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Prepare directories
      # ==========================================

      - name: Prepare directories
        run: |
          mkdir -p "$WORKSPACE"
          mkdir -p "$LOGDIR"
          mkdir -p "$VNCDIR"

          echo "Workspace: $WORKSPACE"
          echo "Logs:      $LOGDIR"
          echo "VNC:       $VNCDIR"

      # ==========================================
      # Find previous workspace
      # ==========================================

      - name: Find previous workspace
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          ARTIFACT_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=dao-workspace&per_page=100" \
            --jq '
              .artifacts
              | map(select(.expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Previous workspace found:"
            echo "$ARTIFACT_ID"

            echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "No previous workspace found."

            echo "artifact_id=" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================
      # Restore previous workspace
      # ==========================================

      - name: Restore workspace
        if: steps.previous.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "Downloading previous workspace..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.previous.outputs.artifact_id }}/zip" \
            > /tmp/dao-workspace.zip

          mkdir -p "$WORKSPACE"

          unzip -o \
            /tmp/dao-workspace.zip \
            -d "$WORKSPACE"

          echo "Workspace restored."

          find "$WORKSPACE" -maxdepth 2 -type f | head -50 || true

      # ==========================================
      # Install packages
      # ==========================================

      - name: Install desktop
        run: |

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            dbus-user-session \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify \
            filezilla \
            geany \
            wget \
            curl \
            unzip \
            jq

      # ==========================================
      # AnyDesk
      # ==========================================

      - name: Install AnyDesk
        continue-on-error: true
        run: |

          echo "Installing AnyDesk..."

          wget -q \
            https://download.anydesk.com/linux/anydesk_8.0.4-1_amd64.deb \
            -O /tmp/anydesk.deb

          if [ -s /tmp/anydesk.deb ]; then

            sudo apt-get install -y \
              /tmp/anydesk.deb || true

          fi

          if command -v anydesk >/dev/null 2>&1; then
            echo "AnyDesk installed successfully."
            anydesk --version || true
          else
            echo "AnyDesk is unavailable."
          fi

      # ==========================================
      # VNC password
      # ==========================================

      - name: Configure VNC password
        run: |

          mkdir -p "$VNCDIR"

          # Temporary password for VNC.
          # Change this value if you want another password.
          VNC_PASSWORD="DAO12345"

          printf '%s\n' "$VNC_PASSWORD" \
            | vncpasswd -f \
            > "$VNCDIR/passwd"

          chmod 600 "$VNCDIR/passwd"

          echo "VNC password configured."

      # ==========================================
      # VNC startup
      # ==========================================

      - name: Configure VNC desktop
        run: |

          cat > "$VNCDIR/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export DISPLAY=:1
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          cd /home/runner/dao-workspace

          startxfce4 &

          sleep 10

          # FileZilla
          filezilla &

          # Geany
          geany &

          # AnyDesk if available
          if command -v anydesk >/dev/null 2>&1; then
              anydesk &
          fi

          wait
          EOF

          chmod +x "$VNCDIR/xstartup"

      # ==========================================
      # Start VNC
      # ==========================================

      - name: Start VNC
        run: |

          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost no \
            -rfbauth "$VNCDIR/passwd"

          sleep 8

          echo "VNC status:"
          vncserver -list

          echo "Testing VNC..."

          if ! pgrep -f "Xtigervnc.*:1" >/dev/null; then
            echo "VNC failed to start."
            cat "$VNCDIR"/*.log 2>/dev/null || true
            exit 1
          fi

          echo "VNC started successfully."

      # ==========================================
      # Start noVNC
      # ==========================================

      - name: Start noVNC
        run: |

          nohup websockify \
            --web=/usr/share/novnc/ \
            8080 \
            127.0.0.1:5901 \
            > "$LOGDIR/novnc.log" 2>&1 &

          echo $! > "$LOGDIR/novnc.pid"

          sleep 5

          if ! pgrep -f "websockify.*8080" >/dev/null; then
            echo "noVNC failed."

            cat "$LOGDIR/novnc.log" || true

            exit 1
          fi

          echo "noVNC started."

      # ==========================================
      # Install Cloudflare Tunnel
      # ==========================================

      - name: Install cloudflared
        run: |

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x \
            /usr/local/bin/cloudflared

          cloudflared --version

      # ==========================================
      # Start Cloudflare Tunnel
      # ==========================================

      - name: Start public desktop
        run: |

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > "$LOGDIR/cloudflared.log" 2>&1 &

          echo $! > "$LOGDIR/cloudflared.pid"

          echo "Waiting for public URL..."

          URL=""

          for i in $(seq 1 60); do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$LOGDIR/cloudflared.log" \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$URL" ]; then

            echo "Cloudflare URL was not found."

            cat "$LOGDIR/cloudflared.log"

            exit 1

          fi

          DESKTOP_URL="${URL}/vnc.html?autoconnect=true&resize=remote"

          echo "===================================================="
          echo "           DAO WEB DESKTOP ONLINE"
          echo "===================================================="
          echo
          echo "OPEN THIS URL:"
          echo
          echo "$DESKTOP_URL"
          echo
          echo "VNC PASSWORD:"
          echo "DAO12345"
          echo
          echo "Applications:"
          echo "  FileZilla"
          echo "  Geany"
          echo "  AnyDesk"
          echo
          echo "===================================================="

          echo "$DESKTOP_URL" > "$LOGDIR/desktop-url.txt"

      # ==========================================
      # Keep alive
      # ==========================================

      - name: Keep desktop alive
        run: |

          echo "Desktop is running for up to 4 hours."

          for MINUTE in $(seq 1 240); do

            if ! pgrep -f "Xtigervnc.*:1" >/dev/null; then

              echo "VNC stopped unexpectedly."

              exit 1

            fi

            if ! pgrep -f "websockify.*8080" >/dev/null; then

              echo "noVNC stopped unexpectedly."

              exit 1

            fi

            echo "[$(date '+%H:%M:%S')] Running: $MINUTE/240 minutes"

            sleep 60

          done

          echo "4 hours completed."

      # ==========================================
      # Save workspace
      # ==========================================

      - name: Save workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-workspace
          path: /home/runner/dao-workspace/
          retention-days: 30
          if-no-files-found: warn

      # ==========================================
      # Save logs
      # ==========================================

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-desktop-logs
          path: |
            /home/runner/dao-logs/
            /home/runner/.vnc/
          retention-days: 7
          if-no-files-found: warn

      # ==========================================
      # Shutdown
      # ==========================================

      - name: Shutdown
        if: always()
        run: |

          echo "Stopping services..."

          if [ -f "$LOGDIR/cloudflared.pid" ]; then
            kill "$(cat "$LOGDIR/cloudflared.pid")" 2>/dev/null || true
          fi

          if [ -f "$LOGDIR/novnc.pid" ]; then
            kill "$(cat "$LOGDIR/novnc.pid")" 2>/dev/null || true
          fi

          pkill -9 Xtigervnc 2>/dev/null || true
          pkill -9 websockify 2>/dev/null || true
          pkill -9 filezilla 2>/dev/null || true
          pkill -9 geany 2>/dev/null || true
          pkill -9 anydesk 2>/dev/null || true

          echo "Desktop stopped."
